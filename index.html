<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chez! v0.7</title>
<style>
:root{
  --bg:#0e1116; --panel:#161a21; --panel2:#1e242e; --fg:#e9ecf2; --muted:#8b93a3;
  --accent:#7cd4a3; --accent-fg:#08120c;
  --sq-light:#e9e4d9; --sq-dark:#7d8b96;
  --pw:#ffffff; --pb:#1b1f27; --pw-s:rgba(0,0,0,.55); --pb-s:rgba(255,255,255,.35);
  --board:350px; --radius:12px;
}
body[data-theme="light"]{--bg:#f2f4f8;--panel:#ffffff;--panel2:#eaeef4;--fg:#131820;--muted:#5b6573;--pw-s:rgba(0,0,0,.35);--pb-s:rgba(0,0,0,.25);}
body[data-theme="contrast"]{--bg:#000;--panel:#0b0b0b;--panel2:#181818;--fg:#fff;--muted:#9a9a9a;--accent:#ffd400;--accent-fg:#000;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:#05070a}
body{font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;color:var(--fg);user-select:none;display:grid;place-items:center}
#stage{position:relative;width:900px;height:600px;transform-origin:center;background:var(--bg);
  overflow:hidden;color:var(--fg);box-shadow:0 0 0 1px rgba(255,255,255,.05);contain:strict}
#app{position:absolute;inset:0;display:flex;gap:12px;padding:12px;align-items:flex-start;justify-content:center;overflow:hidden}
#side{width:var(--board);flex:0 0 auto;display:flex;flex-direction:column;gap:6px}
#title{margin:0;font-size:22px;letter-spacing:.5px;font-weight:800;
  background:linear-gradient(90deg,var(--accent),var(--fg));-webkit-background-clip:text;background-clip:text;color:transparent}
#logoWrap{width:100%;aspect-ratio:1/1;background:var(--panel);border-radius:var(--radius);overflow:hidden;
  display:grid;place-items:center;border:1px solid rgba(255,255,255,.07)}
#logo{width:100%;height:100%;object-fit:contain;display:block}
#menu{display:flex;flex-direction:column;gap:5px}
.mbtn{display:flex;align-items:center;gap:9px;width:100%;padding:7px 11px;border-radius:10px;
  border:1px solid rgba(255,255,255,.08);background:var(--panel);color:var(--fg);font-size:12px;font-weight:650;
  cursor:pointer;transition:transform .12s,background .2s,border-color .2s;font-family:inherit}
.mbtn:hover{background:var(--panel2);border-color:var(--accent);transform:translateY(-1px)}
.mbtn:active{transform:scale(.985)}
.mbtn .ico{width:18px;height:18px;display:grid;place-items:center;opacity:.9;flex:0 0 auto}
.mbtn svg{width:16px;height:16px;fill:currentColor}
#main{flex:0 0 auto;display:flex;flex-direction:column;gap:6px;align-items:stretch}
#topbar{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--muted)}
#ver{letter-spacing:.3px}
.wnwrap{position:relative}
#wnBtn{background:transparent;border:1px solid rgba(255,255,255,.12);color:var(--muted);border-radius:7px;
  padding:3px 9px;font-size:11px;cursor:pointer;font-family:inherit;transition:.2s}
#wnBtn:hover{color:var(--fg);border-color:var(--accent)}
#wnPop{position:absolute;right:0;top:calc(100% + 6px);width:250px;background:var(--panel);border:1px solid rgba(255,255,255,.1);
  border-radius:12px;padding:11px 13px;font-size:11.5px;line-height:1.55;color:var(--fg);z-index:60;
  opacity:0;visibility:hidden;transform:translateY(-6px);transition:.18s;box-shadow:0 12px 40px rgba(0,0,0,.45)}
.wnwrap:hover #wnPop{opacity:1;visibility:visible;transform:translateY(0)}
#wnPop ul{margin:6px 0 0;padding-left:14px;color:var(--muted)}
#wnPop li{margin:2px 0}
#playArea{display:flex;align-items:flex-start;overflow:hidden}
#boardCol{display:flex;flex-direction:column;gap:4px;align-items:center}
.capRow{width:var(--board);min-height:20px;display:flex;flex-wrap:wrap;gap:2px;align-items:center;
  padding:1px 4px;border-radius:6px;background:rgba(127,127,127,.07);font-size:15px;line-height:1;color:var(--muted)}
.capRow .cp{opacity:.85;animation:pop .25s ease}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:.85}}
#board{width:var(--board);height:var(--board);position:relative;border-radius:8px;overflow:hidden;
  box-shadow:0 12px 38px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.06);touch-action:none}
#board[data-rar="uncommon"]{box-shadow:0 0 0 2px rgba(124,212,163,.4),0 12px 38px rgba(0,0,0,.45)}
#board[data-rar="rare"]{box-shadow:0 0 0 3px rgba(91,168,255,.5),0 0 25px rgba(91,168,255,.3),0 12px 38px rgba(0,0,0,.45)}
#board[data-rar="epic"]{box-shadow:0 0 0 3px rgba(160,107,255,.6),0 0 30px rgba(160,107,255,.4),0 12px 38px rgba(0,0,0,.45)}
#board[data-rar="legendary"]{box-shadow:0 0 0 3px rgba(255,180,0,.6),0 0 35px rgba(255,180,0,.5),0 12px 38px rgba(0,0,0,.45);animation:boardLegend 2.5s infinite}
#board[data-rar="mythic"]{box-shadow:0 0 0 4px rgba(255,92,92,.6),0 0 40px rgba(255,92,92,.5),0 12px 38px rgba(0,0,0,.45)}
#board[data-rar="cosmic"]{box-shadow:0 0 0 4px rgba(0,229,192,.7),0 0 50px rgba(0,229,192,.6),0 12px 38px rgba(0,0,0,.45);animation:boardCosmic 3s infinite}
#board[data-rar="true"]{box-shadow:0 0 0 4px rgba(255,215,0,.7),0 0 60px rgba(255,215,0,.6),0 12px 38px rgba(0,0,0,.45);animation:boardTrue 2s infinite}
#board[data-rar="magical"]{animation:hue 5s linear infinite;box-shadow:0 0 0 4px rgba(255,0,255,.7),0 0 50px rgba(255,0,255,.5),0 12px 38px rgba(0,0,0,.45)}
#board[data-rar="supreme"]{box-shadow:0 0 0 5px rgba(255,107,0,.8),0 0 70px rgba(255,51,0,.7),0 12px 38px rgba(0,0,0,.45);animation:boardFlame 2s infinite}
#board[data-rar="divine"]{box-shadow:0 0 0 5px rgba(255,244,194,.8),0 0 80px rgba(255,215,0,.7),0 12px 38px rgba(0,0,0,.45);animation:boardDivine 2.5s infinite}
#board[data-rar="secret"]{animation:hue 3s linear infinite;box-shadow:0 0 0 4px rgba(255,0,255,.8),0 0 60px rgba(255,0,255,.7),0 12px 38px rgba(0,0,0,.45)}
@keyframes boardLegend{50%{filter:brightness(1.12)}}
@keyframes boardCosmic{50%{filter:brightness(1.18) hue-rotate(15deg)}}
@keyframes boardTrue{50%{box-shadow:0 0 0 5px rgba(255,215,0,.95),0 0 80px rgba(255,215,0,.75),0 12px 38px rgba(0,0,0,.45)}}
@keyframes boardFlame{50%{filter:brightness(1.3) hue-rotate(-15deg)}}
@keyframes boardDivine{50%{box-shadow:0 0 0 6px rgba(255,244,194,1),0 0 100px rgba(255,215,0,.9),0 12px 38px rgba(0,0,0,.45)}}
#squares{position:absolute;inset:0;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);z-index:0}
.sq{position:relative}
.sq.light{background:var(--sq-light)}
.sq.dark{background:var(--sq-dark)}
.sq .coord{position:absolute;font-size:max(7px,calc(var(--board)/44));font-weight:700;line-height:1;pointer-events:none;opacity:.7}
.sq .coord.file{right:5%;bottom:2%}
.sq .coord.rank{left:5%;top:2%}
.sq.light .coord{color:var(--sq-dark)}
.sq.dark .coord{color:var(--sq-light)}
.sq.sel::after{content:'';position:absolute;inset:0;box-shadow:inset 0 0 0 3px var(--accent);border-radius:2px;pointer-events:none}
.sq.check::after{content:'';position:absolute;inset:0;background:radial-gradient(circle,rgba(255,60,60,.85),transparent 72%);pointer-events:none}
.sq.lastmv::after{content:'';position:absolute;inset:0;background:rgba(124,212,163,.22);pointer-events:none}
.sq.hint-from::before,.sq.hint-to::before{content:'';position:absolute;inset:0;pointer-events:none;border-radius:2px;
  background:rgba(255,77,77,.12);box-shadow:inset 0 0 0 3px rgba(255,77,77,.5),inset 0 0 16px rgba(255,77,77,.3);animation:hintPulse 1.6s ease-in-out infinite}
@keyframes hintPulse{0%,100%{box-shadow:inset 0 0 0 3px rgba(255,77,77,.5),inset 0 0 16px rgba(255,77,77,.3)}50%{box-shadow:inset 0 0 0 3px rgba(255,77,77,.85),inset 0 0 26px rgba(255,77,77,.55)}}
#pieces{position:absolute;inset:0;pointer-events:none;z-index:10}
.piece{position:absolute;left:0;top:0;width:12.5%;height:12.5%;display:flex;align-items:center;justify-content:center;
  font-size:calc(var(--board)/10.2);line-height:1;will-change:transform;
  transition:transform .22s cubic-bezier(.25,1,.35,1);font-family:'Segoe UI Symbol','Apple Symbols','Noto Sans Symbols',serif}
.piece.w{color:var(--pw);-webkit-text-stroke:1.2px var(--pw-s)}
.piece.b{color:var(--pb);-webkit-text-stroke:1.2px var(--pb-s)}
.piece[data-rar="uncommon"]{text-shadow:0 1px 3px rgba(124,212,163,.4)}
.piece[data-rar="rare"]{text-shadow:0 0 4px currentColor,0 0 8px currentColor}
.piece[data-rar="epic"]{text-shadow:0 0 5px currentColor,0 0 12px currentColor;filter:brightness(1.1)}
.piece[data-rar="legendary"]{text-shadow:0 0 6px currentColor,0 0 14px currentColor,0 0 22px currentColor;animation:pShimmer 2.5s infinite}
.piece[data-rar="mythic"]{text-shadow:0 0 8px currentColor,0 0 18px currentColor,0 0 28px currentColor;filter:brightness(1.2)}
.piece[data-rar="cosmic"]{text-shadow:0 0 10px #00e5c0,0 0 20px #00e5c0,0 0 30px #3b2c74;animation:pCosmic 3s infinite}
.piece[data-rar="true"]{text-shadow:0 0 12px #ffd700,0 0 24px #ffd700,0 0 36px #ffd700;animation:pGold 1.8s infinite}
.piece[data-rar="magical"]{animation:hue 4s linear infinite;text-shadow:0 0 8px currentColor}
.piece[data-rar="supreme"]{text-shadow:0 0 15px #ff6b00,0 0 30px #ff3300,0 0 45px #ff0000;animation:pFlame 2s infinite}
.piece[data-rar="divine"]{text-shadow:0 0 18px #fff4c2,0 0 36px #ffd700,0 0 54px #ffaa00;animation:pDivine 2.5s infinite}
.piece[data-rar="secret"]{text-shadow:0 0 10px #ff00ff,0 0 20px #ff00ff,0 0 30px #00ffff;animation:hue 3s linear infinite}
@keyframes pShimmer{50%{filter:brightness(1.3)}}
@keyframes pCosmic{50%{filter:brightness(1.3) hue-rotate(20deg)}}
@keyframes pGold{50%{text-shadow:0 0 20px #ffd700,0 0 40px #ffd700,0 0 60px #ffd700}}
@keyframes pFlame{50%{filter:brightness(1.4) hue-rotate(-15deg)}}
@keyframes pDivine{50%{text-shadow:0 0 25px #fff4c2,0 0 50px #ffd700,0 0 75px #ffaa00}}
@keyframes hue{to{filter:hue-rotate(360deg)}}
.piece.drag{transition:none;z-index:30;font-size:calc(var(--board)/9.0);filter:drop-shadow(0 10px 14px rgba(0,0,0,.55))}
.piece.gone{opacity:0;transform:scale(.4)!important;transition:opacity .18s,transform .18s}
.noanim .piece{transition:none!important}
#arrows{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5;overflow:visible}
.qmark{position:absolute;width:12.5%;height:12.5%;display:flex;align-items:flex-start;justify-content:flex-end;
  padding:2%;font-size:calc(var(--board)/24);font-weight:800;pointer-events:none;z-index:25;
  color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.9),0 0 8px rgba(0,0,0,.7);
  scale:.6;opacity:0;animation:qpop .16s ease-out forwards}
@keyframes qpop{to{scale:1;opacity:1}}
#sideCol{width:0;overflow:hidden;transition:width .25s,margin-left .25s;margin-left:0}
#sideCol.on{width:110px;margin-left:10px}
#sideColInner{width:110px;display:flex;flex-direction:column;gap:6px}
.panelbox{background:var(--panel);border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:8px}
.panelbox h4{margin:0 0 5px;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
#moveList{height:calc(var(--board) - 60px);overflow-y:auto;font-size:11px;line-height:1.6;font-variant-numeric:tabular-nums}
#moveList div{display:flex;gap:4px;color:var(--muted)}
#moveList div b{color:var(--fg);font-weight:600}
#statusLine{font-size:11.5px;color:var(--muted);text-align:center;min-height:16px;width:100%}
#gameBar{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;width:100%}
.sbtn{background:var(--panel);border:1px solid rgba(255,255,255,.09);color:var(--fg);border-radius:8px;
  padding:6px 10px;font-size:11.5px;cursor:pointer;font-family:inherit;transition:.2s}
.sbtn:hover{border-color:var(--accent);background:var(--panel2)}
#trainerBox{width:100%;max-height:80px;overflow-y:auto;font-size:11.5px;line-height:1.5;display:none}
#trainerBox .msg{background:var(--panel);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;
  padding:6px 9px;margin-bottom:5px;animation:fade .2s}
#trainerBox .msg.goal{border-left-color:#ffd84d;background:rgba(255,216,77,.07)}
#modalRoot{position:absolute;inset:0;pointer-events:none;z-index:100}
.modal-back{position:absolute;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);
  display:grid;place-items:center;pointer-events:auto;animation:fade .18s ease;padding:16px;overflow:hidden}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{width:480px;max-width:100%;max-height:520px;display:flex;flex-direction:column;background:var(--panel);
  border:1px solid rgba(255,255,255,.1);border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.6);
  animation:up .2s cubic-bezier(.2,.9,.3,1);overflow:hidden}
@keyframes up{from{transform:translateY(14px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.modal.wide{width:760px;max-height:540px}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.07);flex:0 0 auto}
.modal-head h3{margin:0;font-size:15px;font-weight:750}
.xbtn{background:transparent;border:0;color:var(--muted);font-size:15px;cursor:pointer;padding:4px 8px;border-radius:7px}
.xbtn:hover{background:var(--panel2);color:var(--fg)}
.modal-body{padding:12px 14px;overflow-y:auto;font-size:12.5px;line-height:1.6;flex:1 1 auto;min-height:0}
.modal-foot{padding:10px 14px;display:flex;gap:8px;justify-content:flex-end;border-top:1px solid rgba(255,255,255,.07);flex-wrap:wrap;flex:0 0 auto}
.btn{background:var(--panel2);border:1px solid rgba(255,255,255,.1);color:var(--fg);border-radius:9px;
  padding:8px 14px;font-size:12.5px;cursor:pointer;font-family:inherit;transition:.2s;font-weight:600}
.btn:hover{border-color:var(--accent);transform:translateY(-1px)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.listRow{display:flex;align-items:center;gap:10px;padding:10px 11px;border-radius:11px;background:var(--panel2);
  border:1px solid transparent;margin-bottom:7px;cursor:pointer;transition:.18s}
.listRow:hover{border-color:var(--accent);transform:translateX(2px)}
.listRow.locked{opacity:.45;cursor:not-allowed}
.listRow.locked:hover{transform:none;border-color:transparent}
.listRow .nm{flex:1;font-weight:650}
.listRow .sub{font-size:11px;color:var(--muted);font-weight:400}
.badge{font-size:10.5px;padding:3px 8px;border-radius:99px;background:rgba(124,212,163,.15);color:var(--accent);font-weight:700}
.tabs{display:flex;gap:5px;margin-bottom:10px;flex-wrap:wrap}
.tab{padding:6px 12px;border-radius:8px;background:var(--panel2);border:1px solid transparent;cursor:pointer;
  font-size:11.5px;font-family:inherit;color:var(--muted);transition:.2s;font-weight:600}
.tab.on{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.card{background:var(--panel2);border:1px solid rgba(255,255,255,.07);border-radius:11px;padding:8px;text-align:center;transition:.18s;position:relative}
.card:hover{border-color:var(--accent)}
.card .prev{height:46px;border-radius:7px;display:grid;place-items:center;margin-bottom:5px;font-size:20px;overflow:hidden;position:relative}
.card .nm{font-size:11.5px;font-weight:650;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .rar-lbl{font-size:9px;font-weight:700;text-transform:uppercase;margin-bottom:2px;letter-spacing:.05em}
.card .pr{font-size:10.5px;color:var(--muted);margin-bottom:5px}
.card .btn{width:100%;padding:4px;font-size:11px;border-radius:7px}
.card.owned .pr{color:var(--accent)}
.card.locked{opacity:.45}
.card.locked:hover{border-color:rgba(255,255,255,.07)}
.setRow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;
  border-bottom:1px solid rgba(255,255,255,.05);font-size:12.5px}
.setRow:last-child{border-bottom:0}
.switch{width:42px;height:23px;border-radius:99px;background:var(--panel2);border:1px solid rgba(255,255,255,.12);
  position:relative;cursor:pointer;transition:.2s;flex:0 0 auto}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;
  background:var(--muted);transition:.2s}
.switch.on{background:var(--accent);border-color:transparent}
.switch.on::after{left:21px;background:var(--accent-fg)}
select,input[type=color]{background:var(--panel2);border:1px solid rgba(255,255,255,.12);color:var(--fg);
  border-radius:7px;padding:5px 8px;font-family:inherit;font-size:11.5px;cursor:pointer}
input[type=color]{padding:2px;height:28px;width:44px}
.toast{position:absolute;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--panel);
  border:1px solid var(--accent);color:var(--fg);padding:9px 16px;border-radius:11px;font-size:12.5px;
  z-index:300;opacity:0;transition:.25s;box-shadow:0 12px 32px rgba(0,0,0,.5);pointer-events:none;max-width:80%}
.toast.show{opacity:1;transform:translate(-50%,0)}
.more-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:6px 0}
.more-item{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:18px 8px;background:var(--panel2);border:1px solid rgba(255,255,255,.07);border-radius:12px;
  cursor:pointer;transition:.18s;min-height:80px}
.more-item:hover{background:var(--panel);border-color:var(--accent);transform:translateY(-2px)}
.more-item svg{width:26px;height:26px;fill:var(--accent);transition:.18s}
.more-item:hover svg{transform:scale(1.15)}
.more-item .lbl{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-size:10px;
  color:var(--muted);opacity:0;transition:.18s;font-weight:600}
.more-item:hover .lbl{opacity:1;color:var(--fg)}
.mastery-track{display:flex;gap:6px;overflow-x:auto;padding:8px 2px 14px}
.mastery-node{flex:0 0 auto;width:92px;padding:8px 6px;background:var(--panel2);border:1px solid rgba(255,255,255,.07);
  border-radius:11px;text-align:center}
.mastery-node.reached{border-color:var(--accent);background:rgba(124,212,163,.08)}
.mastery-node.current{box-shadow:0 0 0 2px var(--accent)}
.mastery-node .lvl{font-size:10px;color:var(--muted);font-weight:700}
.mastery-node .nm{font-size:11.5px;font-weight:700;margin:2px 0}
.mastery-node .rw{font-size:10px;color:var(--accent);line-height:1.3;margin-top:3px;min-height:28px}
.mastery-node .xp{font-size:9.5px;color:var(--muted);margin-top:2px}
.rar-C{color:#9aa0a6} .rar-U{color:#7cd4a3} .rar-R{color:#5ba8ff} .rar-E{color:#a06bff}
.rar-L{color:#ffb400} .rar-M{color:#ff5c5c} .rar-K{color:#00e5c0} .rar-T{color:#ffd700}
.rar-G{color:#ff00ff} .rar-P{color:#ffffff} .rar-D{color:#fff4c2} .rar-S{color:#ff00ff}
#stage[data-orient="portrait"]{width:600px;height:900px}
#stage[data-orient="portrait"] #app{flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px}
#stage[data-orient="portrait"] #main{order:1;flex:0 0 auto;width:var(--board)}
#stage[data-orient="portrait"] #side{order:2;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;
  gap:6px 10px;width:var(--board);align-items:center;flex:0 0 auto}
#stage[data-orient="portrait"] #title{grid-column:1/-1;grid-row:1;font-size:18px;margin:0;text-align:left}
#stage[data-orient="portrait"] #logoWrap{grid-column:1;grid-row:2;width:80px;height:80px;aspect-ratio:auto}
#stage[data-orient="portrait"] #menu{grid-column:2;grid-row:2;display:grid;grid-template-columns:1fr 1fr;gap:5px}
#stage[data-orient="portrait"] .mbtn{padding:7px 9px;font-size:11px;gap:5px}
#stage[data-orient="portrait"] #sideCol.on{width:0;margin-left:0}
#stage[data-orient="portrait"] #sideColInner{display:none}
#stage[data-orient="portrait"] #trainerBox{max-height:90px}

/* ===== v0.7 additions ===== */
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;overflow:hidden;
  background:var(--panel2);font-size:20px;font-weight:800;flex:0 0 auto;border:1px solid rgba(255,255,255,.12)}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}

/* ================= CHESS ENGINE ================= */
function parseFEN(fen){
  const p=fen.split(' ');

    let row='',empty=0;
    for(let f=0;f<8;f++){
      const p=st.b[r*8+f];

}
const cloneSt=s=>({b:s.b.slice(),turn:s.turn,castle:s.castle,ep:s.ep,half:s.half,full:s.full,last:s.last});
const KN=[[1,2],[2,1],[2,-1],[1,-2],[-1,-2],[-2,-1],[-2,1],[-1,2]];
const BD=[[1,1],[1,-1],[-1,-1],[-1,1]];
const RD=[[1,0],[-1,0],[0,1],[0,-1]];

function findKing(b,color){
  const k=color==='w'?'K':'k';
  for(let i=0;i<64;i++) if(b[i]&&b[i].k===k) return i;

function attacked(b,sq,by){

  }
  for(const [df,dr] of KD){
    const nf=f+df,nr=r+dr;

  for(const [df,dr] of BD){
    let nf=f+df,nr=r+dr;

      if(p){ if(p.k===B||p.k===Q) return true; break; }
      nf+=df;nr+=dr;

  for(const [df,dr] of RD){
    let nf=f+df,nr=r+dr;
    while(inB(nf,nr)){
      const p=b[nr*8+nf];
      if(p){ if(p.k===R||p.k===Q) return true; break; }

}
function addPawn(out,from,to,promo){
  if(promo){for(const p of ['q','r','b','n'])out.push({from,to,promo:p});}

function genPseudo(st,color){
  const b=st.b,out=[];
  const own=p=>p&&((p.k<'a')===(color==='w'));
  for(let i=0;i<64;i++){
    const p=b[i]; if(!p||!own(p))continue;
    const f=i%8,r=(i/8)|0,t=p.k.toLowerCase();

  const disamb = san.slice(0,-2);
  const to = nameToSq(toStr);
  if(!(to>=0&&to<64)) return null;
  const candidates = moves.filter(m=>{
    const p = st.b[m.from];
    if(!p) return false;
    if(p.k.toUpperCase() !== piece) return false;
    if(m.to !== to) return false;
    if(promotion && m.promo !== promotion) return false;
    if(!promotion && m.promo) return false;
    if(disamb){
      const fromFile = disamb.includes(FILES[m.from%8]);
      const fromRank = disamb.includes(String(8-(m.from>>3)));
      if(!fromFile && !fromRank) return false;
    }
    return true;
  });
  return candidates[0] || null;
}

/* ================= AI ================= */
let nodes=0, NODE_LIMIT=140000;
function evaluate(st){
  let s=0;
  for(let i=0;i<64;i++){
    const p=st.b[i]; if(!p)continue;
    const white=p.k<'a', t=p.k.toLowerCase();
    let v=VAL[t];
    const f=i%8,r=(i/8)|0;
    const c=3.5-Math.max(Math.abs(f-3.5),Math.abs(r-3.5));
    if(t==='n'||t==='b') v+=c*7;
    else if(t==='p') v+=c*5;
    else if(t==='k') v-=c*5;
    s+=white?v:-v;
  }
  return s;
}
const evalSide=st=>st.turn==='w'?evaluate(st):-evaluate(st);
function scoreMove(st,m){
  let s=0;
  const t=st.b[m.to],p=st.b[m.from];
  if(t) s+=10*VAL[t.k.toLowerCase()]-VAL[p.k.toLowerCase()];
  if(m.promo) s+=800;
  if(m.flag==='ep') s+=100;
  if(m.flag==='castleK'||m.flag==='castleQ') s+=40;
  return s;
}
function search(st,depth,alpha,beta){
  if(++nodes>NODE_LIMIT) return evalSide(st);
  if(depth<=0) return evalSide(st);
  const moves=legalMoves(st);
  if(!moves.length){
    const k=findKing(st.b,st.turn);
    if(k>=0&&attacked(st.b,k,st.turn==='w'?'b':'w')) return -99999+(10-depth);
    return 0;
  }
  moves.sort((a,b)=>scoreMove(st,b)-scoreMove(st,a));
  let best=-Infinity;
  for(const m of moves){
    const sc=-search(makeMove(st,m),depth-1,-beta,-alpha);
    if(sc>best)best=sc;
    if(best>alpha)alpha=best;
    if(alpha>=beta)break;
  }
  return best;
}
function pickMove(st,elo){
  const moves=legalMoves(st);
  if(!moves.length) return null;
  const rndP = elo<=100?0.5 : elo<=250?0.28 : elo<=450?0.12 : elo<=800?0.04 : 0;
  if(Math.random()<rndP) return moves[Math.random()*moves.length|0];
  const depth = elo<300?1 : elo<700?2 : 3;
  nodes=0;NODE_LIMIT=120000;
  moves.sort((a,b)=>scoreMove(st,b)-scoreMove(st,a));
  let best=moves[0],bestSc=-Infinity,alpha=-Infinity;
  for(const m of moves){
    const sc=-search(makeMove(st,m),depth-1,-Infinity,-alpha);
    if(sc>bestSc){bestSc=sc;best=m;}
    if(sc>alpha)alpha=sc;
    if(nodes>NODE_LIMIT)break;
  }
  return best;
}

function hslToHex(h,s,l){
  s/=100; l/=100;
  const a=s*Math.min(l,1-l);
  const f=n=>{
    const k=(n+h/30)%12;
    const color=l-a*Math.max(-1,Math.min(k-3,Math.min(9-k,1)));
    return Math.round(255*color).toString(16).padStart(2,'0');
  };
  return '#'+f(0)+f(8)+f(4);
}

function parseOpeningLine(text){
  const clean = text.split(/[—–]/)[0].trim();
  const tokens = clean.replace(/\d+\./g,' ').replace(/\s+/g,' ').trim().split(' ').filter(Boolean);
  return tokens.filter(t=>/^[NBRQK]?[a-h]?[1-8]?x?[a-h][1-8](=[NBRQ])?$/i.test(t) || /^[O0]-[O0](-[O0])?$/i.test(t));
}
function goalDescription(data){
  switch(data.goal){
    case 'mate': return data.mateIn1?'Поставьте мат одним ходом.':'Доведите партию до мата.';
    case 'promote': return 'Проведите пешку в ферзи.';
    case 'capture': return 'Съешьте фигуру соперника.';
    case 'check': return 'Объявите шах королю соперника.';
    case 'castle': return 'Сделайте рокировку.';
    case 'ep': return 'Возьмите пешку на проходе.';
    case 'moves': return `Сделайте ${data.n} ходов.`;
    case 'line': return 'Разыграйте дебют по указке тренера.';
  }
  return 'Тренируйтесь.';
}

function getMasteryLevel(xp){
  let idx=0;
  for(let i=0;i<MASTERY.length;i++){ if(xp>=MASTERY[i].xp) idx=i; else break; }
  return {index:idx, level:idx+1, name:MASTERY[idx].name, xp:MASTERY[idx].xp};
}
function formatMasteryReward(r){
  if(!r) return 'Титул';
  const parts=[];
  if(r.stars) parts.push(`${r.stars}★`);
  if(r.boardSkin!==undefined) parts.push('Доска «'+BOARD_SKINS[r.boardSkin].name+'»');
  if(r.pieceSkin!==undefined) parts.push('Фигуры «'+PIECE_SKINS[r.pieceSkin].name+'»');
  if(r.avatar) parts.push('Аватар '+r.avatar);
  if(r.frame){const f=SHOP_DATA.frames.find(x=>x.id===r.frame);parts.push('Рамка «'+(f?f.name:r.frame)+'»');}
  return parts.join(' + ')||'—';
}

function readJSON(key){try{const r=localStorage.getItem(key);return r?JSON.parse(r):null;}catch(e){return null;}}

function migrateSave(){
  let s=null;
  for(const k of [SAVE_KEY,...LEGACY_SAVE_KEYS]){const raw=readJSON(k);if(raw){s=raw;break;}}
  const d=JSON.parse(JSON.stringify(DEFAULT_SAVE));
  if(!s||typeof s!=='object') return d;
  const st=(s.stats&&typeof s.stats==='object')?s.stats:{};
  const num=(v,f)=>{const n=Number(v);return Number.isFinite(n)?n:f;};
  const inv=s.inventory||{};
  const m={
    stars:num(s.stars,0),crowns:num(s.crowns,0),
    unlocked:clamp(Math.round(num(s.unlocked,1)),1,BOTS.length),
    owned:{
      board:normArr(s.owned&&s.owned.board),
      piece:normArr(s.owned&&s.owned.piece),
      sound:normArr(s.owned&&s.owned.sound)
    },
    equipped:Object.assign({},d.equipped,s.equipped||{}),
    settings:Object.assign({},d.settings,s.settings||{}),
    lessons:{
      basics:normArr(s.lessons&&s.lessons.basics),
      debuts:normArr(s.lessons&&s.lessons.debuts),
      mates:normArr(s.lessons&&s.lessons.mates)
    },
    stats:Object.assign({},d.stats,st),
    xp:num(s.xp,0),playerElo:num(s.playerElo,100),rating:num(s.rating,1000),
    achievements:(s.achievements&&typeof s.achievements==='object')?Object.assign({},s.achievements):{},
    collections:Array.isArray(s.collections)?s.collections.filter(c=>c&&typeof c==='object').map(c=>({
      name:String(c.name||'Коллекция'),games:Array.isArray(c.games)?c.games:[]
    })):[],
    claimedMastery:normArr(s.claimedMastery).filter(i=>Number.isInteger(i)&&i>=0),
    inventory:{
      avatars:normArr(inv.avatars),frames:normArr(inv.frames),prefixes:normArr(inv.prefixes)
    },
    avatar_url:safeImgUrl(s.avatar_url),
    is_mod:!!s.is_mod,is_banned:!!s.is_banned,
    purchases:num(s.purchases,0),
    username:typeof s.username==='string'?s.username:'',
    nickColor:typeof s.nickColor==='string'?s.nickColor:d.nickColor,
    nickColor2:typeof s.nickColor2==='string'?s.nickColor2:d.nickColor2,
    is_premium:!!s.is_premium,
    seenWelcome:!!s.seenWelcome
  };
  m.stats.moves=Object.assign({},d.stats.moves,st.moves||{});
  m.stats.brilliant_moves=num(st.brilliant_moves,m.stats.moves['!!']||0);
  m.stats.botWins=(Array.isArray(st.botWins)?st.botWins:d.stats.botWins).slice(0,BOTS.length);
  while(m.stats.botWins.length<BOTS.length)m.stats.botWins.push(0);
  if(st.brilliant_moves&&!m.stats.moves['!!'])m.stats.moves['!!']=Math.max(0,Math.round(num(st.brilliant_moves,0)));
  ['avatars','frames','prefixes'].forEach(k=>{
    m.inventory[k]=m.inventory[k].filter(x=>typeof x==='string');
    if(!m.inventory[k].includes(d.inventory[k][0]))m.inventory[k].unshift(d.inventory[k][0]);
  });
  [['board',BOARD_SKINS],['piece',PIECE_SKINS],['sound',SOUND_SKINS]].forEach(([k,arr])=>{
    m.owned[k]=m.owned[k].filter(i=>Number.isInteger(i)&&i>=0&&i<arr.length);
    if(!m.owned[k].includes(0))m.owned[k].unshift(0);
    if(!(Number.isInteger(m.equipped[k])&&m.equipped[k]>=0&&m.equipped[k]<arr.length))m.equipped[k]=0;
  });
  if(!m.inventory.avatars.includes(m.equipped.avatar))m.inventory.avatars.push(m.equipped.avatar);
  if(!m.inventory.frames.includes(m.equipped.frame))m.inventory.frames.push(m.equipped.frame);
  if(!m.inventory.prefixes.includes(m.equipped.prefix))m.inventory.prefixes.push(m.equipped.prefix);
  ['basics','debuts','mates'].forEach(sec=>{
    m.lessons[sec]=[...new Set(m.lessons[sec].filter(i=>Number.isInteger(i)&&i>=0))].sort((a,b)=>a-b);
  });
  [['board',BOARD_SKINS],['piece',PIECE_SKINS],['sound',SOUND_SKINS]].forEach(([k,arr])=>{
    arr.forEach((sk,i)=>{
      if(sk.rarity!=='secret'&&!sk.premiumOnly&&!m.owned[k].includes(i)) m.owned[k].push(i);

  });
  m.inventory.frames=[...new Set([...m.inventory.frames,...SHOP_DATA.frames.map(f=>f.id)])];
  m.inventory.prefixes=[...new Set([...m.inventory.prefixes,...SHOP_DATA.prefixes.map(p=>p.id)])];
  m.inventory.avatars=[...new Set([...m.inventory.avatars,...SHOP_DATA.avatars.map(a=>a.id)])];
  return m;
}

let AC=null;
function ac(){if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();}if(AC.state==='suspended')AC.resume();return AC;}
function tone(freq,dur,type,vol){
  if(!S.settings.sound) return;
  try{
    const c=ac(),o=c.createOscillator(),g=c.createGain();
    const pk=SOUND_SKINS[S.equipped.sound]||SOUND_SKINS[0];
    o.type=type||pk.type||'sine';
    o.frequency.value=freq*(pk.pitch||1);
    o.connect(g);g.connect(c.destination);
    const tt=c.currentTime;
    g.gain.setValueAtTime(0.0001,tt);
    g.gain.linearRampToValueAtTime((vol||0.08)*(pk.vol||1),tt+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,tt+dur);
    o.start(tt);o.stop(tt+dur+0.03);
  }catch(e){}
}

const boardEl=$('#board'), squaresEl=$('#squares'), piecesEl=$('#pieces');

const pieceEls=new Map();

function boardToView(i){const f=i%8,r=(i/8)|0;return orientation==='w'?r*8+f:(7-r)*8+(7-f);}
function viewToBoard(v){const f=v%8,r=(v/8)|0;return orientation==='w'?r*8+f:(7-r)*8+(7-f);}
function buildSquares(){
  hintFrom=null; hintTo=null;
  squaresEl.innerHTML=''; squares=[];
  for(let v=0;v<64;v++){
    const d=div('sq');
    const f=v%8,r=(v/8)|0;
    d.classList.add(((f+r)%2===0)?'light':'dark');
    const boardIdx = viewToBoard(v);
    const fileChar = 'abcdefgh'[boardIdx % 8];
    const rankNum = 8 - Math.floor(boardIdx / 8);
    if(r === 7){const sp=document.createElement('span');sp.className='coord file';sp.textContent=fileChar;d.appendChild(sp);}
    if(f === 0){const sp=document.createElement('span');sp.className='coord rank';sp.textContent=String(rankNum);d.appendChild(sp);}
    squares.push(d);squaresEl.appendChild(d);
  }
}
function clearHints(){
  if(hintFrom!=null && squares[boardToView(hintFrom)]) squares[boardToView(hintFrom)].classList.remove('hint-from');
  if(hintTo!=null && squares[boardToView(hintTo)]) squares[boardToView(hintTo)].classList.remove('hint-to');
  hintFrom=null; hintTo=null;
}
function setHint(from, to){
  clearHints();
  if(from!=null && squares[boardToView(from)]){squares[boardToView(from)].classList.add('hint-from');hintFrom=from;}
  if(to!=null && squares[boardToView(to)]){squares[boardToView(to)].classList.add('hint-to');hintTo=to;}

function updateDebutHint(){
  if(!G || G.mode!=='lesson' || !G.lesson || !G.lesson.line){ clearHints(); return; }
  const line = G.lesson.line;
  const linePos = G.lesson.linePos;
  if(linePos >= line.length){ clearHints(); return; }
  if(G.st.turn !== G.human){ clearHints(); return; }
  const mv = sanToMove(G.st, line[linePos]);
  if(!mv){ clearHints(); return; }
  setHint(mv.from, mv.to);
}
function posTransform(i){const v=boardToView(i),x=v%8,y=(v/8)|0;return `translate(${x*100}%,${y*100}%)`;}
function renderPieces(st){
  const ps = PIECE_SKINS[S.equipped.piece] || PIECE_SKINS[0];
  const rar = ps.rarity || 'common';
  const seen=new Set();
  for(let i=0;i<64;i++){
    const p=st.b[i]; if(!p) continue;
    seen.add(p.id);
    let el=pieceEls.get(p.id);
    if(!el){el=div('piece');el.dataset.id=p.id;pieceEls.set(p.id,el);piecesEl.appendChild(el);}
    el.textContent=GLYPH[p.k.toLowerCase()];
    el.classList.toggle('w',p.k<'a');
    el.classList.toggle('b',p.k>='a');
    el.dataset.rar=rar;
    el.style.transform=posTransform(i);
  }
  const dead=[];
  pieceEls.forEach((el,id)=>{if(!seen.has(id))dead.push(id);});
  dead.forEach(id=>{
    const el=pieceEls.get(id); if(!el) return;
    el.classList.add('gone'); pieceEls.delete(id);
    setTimeout(()=>el.remove(),240);
  });
}

function updateVisualsOnly(){if(!G) return;showHighlights(G.st);updateArrows();}
const CAP_ORDER=['p','n','b','r','q'];
function drawCaptured(st){
  if(!S.settings.showCaptured){capTopEl.style.display='none';capBotEl.style.display='none';return;}
  capTopEl.style.display='';capBotEl.style.display='';
  const full={P:8,N:2,B:2,R:2,Q:1,p:8,n:2,b:2,r:2,q:1};
  const cur={};
  for(const p of st.b) if(p) cur[p.k]=(cur[p.k]||0)+1;
  const build=(color)=>{
    let out='';
    for(const tp of CAP_ORDER){
      const key=color==='w'?tp.toUpperCase():tp;
      const miss=Math.max(0,(full[key]||0)-(cur[key]||0));
      for(let i=0;i<miss;i++) out+=`<span class="cp">${GLYPH[tp]}</span>`;
    }
    return out;
  };
  const topColor=orientation==='w'?'b':'w';
  capTopEl.innerHTML=build(topColor);
  capBotEl.innerHTML=build(orientation);
}
function updateArrows(){
  while(arrowsEl.firstChild) arrowsEl.removeChild(arrowsEl.firstChild);
  if(!G || selected == null) return;
  const seen = new Set();
  let idx = 0;
  for(const m of legalCache){
    if(m.from !== selected) continue;
    if(seen.has(m.to)) continue;
    seen.add(m.to);
    const fromV = boardToView(m.from);
    const toV = boardToView(m.to);
    const x1 = (fromV%8)*100 + 50;
    const y1 = Math.floor(fromV/8)*100 + 50;
    const x2 = (toV%8)*100 + 50;
    const y2 = Math.floor(toV/8)*100 + 50;
    const isCapture = !!G.st.b[m.to] || m.flag === 'ep';
    const piece = G.st.b[m.from];
    const isKnight = piece && piece.k.toLowerCase() === 'n';
    const color = isCapture ? '#ff5555' : '#ffffff';
    const finalOpacity = 0.3;
    let pathD;
    if(isKnight){
      const dx=x2-x1, dy=y2-y1;
      let cx, cy;
      if(Math.abs(dx) > Math.abs(dy)){ cx=x2; cy=y1; } else { cx=x1; cy=y2; }
      const inset=42;
      let sx=x1, sy=y1, ex=x2, ey=y2;
      if(cx !== x1){ sx = x1 + Math.sign(cx-x1)*inset; } else { sy = y1 + Math.sign(cy-y1)*inset; }
      if(cx !== x2){ ex = x2 - Math.sign(x2-cx)*inset; } else { ey = y2 - Math.sign(y2-cy)*inset; }
      pathD = `M${sx},${sy} L${cx},${cy} L${ex},${ey}`;
    } else {
      const dx=x2-x1, dy=y2-y1;
      const len=Math.hypot(dx,dy)||1;
      const ux=dx/len, uy=dy/len;
      const inset=42;
      const sx=x1+ux*inset, sy=y1+uy*inset;
      const ex=x2-ux*inset, ey=y2-uy*inset;
      pathD=`M${sx},${sy} L${ex},${ey}`;
    }
    const path=document.createElementNS(SVGNS,'path');
    path.setAttribute('d', pathD);
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', color);
    path.setAttribute('stroke-width', '30');
    path.setAttribute('stroke-linecap', 'round');
    path.setAttribute('stroke-linejoin', 'round');
    path.setAttribute('opacity', '0');
    arrowsEl.appendChild(path);
    let L=0; try{ L=path.getTotalLength(); }catch(e){ L=100; }
    path.style.strokeDasharray=L;
    path.style.strokeDashoffset=L;
    const delay = idx*20;
    idx++;
    setTimeout(()=>{
      path.style.transition='stroke-dashoffset .5s ease-out, opacity .15s';
      path.style.strokeDashoffset='0';
      path.style.opacity=String(finalOpacity);
    }, delay);
  }
}

let stretched=false;
function layout(){
  const portrait = window.innerHeight > window.innerWidth;
  const W = portrait ? 600 : 900;
  const H = portrait ? 900 : 600;
  stage.style.width = W + 'px';
  stage.style.height = H + 'px';
  stage.dataset.orient = portrait ? 'portrait' : 'landscape';
  const board = portrait ? 500 : 350;
  document.documentElement.style.setProperty('--board', board + 'px');
  const fitScale = Math.min(window.innerWidth / W, window.innerHeight / H);
  const s = stretched ? fitScale : Math.min(1, fitScale);
  stage.style.transform = `scale(${s})`;
  if(G){ renderPieces(G.st); showHighlights(G.st); updateArrows(); }
}
window.addEventListener('resize', layout);
window.addEventListener('orientationchange', () => setTimeout(layout, 120));
window.addEventListener('keydown', e => {
  const tag=(e.target&&e.target.tagName)||'';
  const typing=tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT';
  const isF=e.code==='KeyF'||e.key==='f'||e.key==='F'||e.key==='а'||e.key==='А';
  if(isF&&!typing&&!e.ctrlKey&&!e.metaKey&&!e.altKey){
    stretched=!stretched;
    layout();
    toast(stretched?'На весь экран (F)':'Обычный масштаб (F)');
    e.preventDefault();
  }
  if(e.key==='Escape') closeModal();
});

function notate(st,m){
  const p=st.b[m.from]; if(!p) return '??';
  if(m.flag==='castleK') return 'O-O';
  if(m.flag==='castleQ') return 'O-O-O';
  const cap=st.b[m.to]||m.flag==='ep';
  let s=p.k.toUpperCase()+sqName(m.from)+(cap?'x':'-')+sqName(m.to);
  if(m.promo) s+='='+m.promo.toUpperCase();
  return s;
}
function evalQuality(st,m){
  const allMoves=legalMoves(st);
  if(!allMoves.length) return '';
  nodes=0; NODE_LIMIT=200000;
  allMoves.sort((a,b)=>scoreMove(st,b)-scoreMove(st,a));
  let bestScore=-Infinity;
  for(const mv of allMoves){
    if(nodes>NODE_LIMIT) break;
    const n=makeMove(st,mv);
    const sc=-search(n,2,-Infinity,Infinity);
    if(sc>bestScore) bestScore=sc;
  }
  const pn=makeMove(st,m);
  const pnMoves=legalMoves(pn);
  const pk=findKing(pn.b,pn.turn);
  const pnInCheck=pk>=0&&attacked(pn.b,pk,pn.turn==='w'?'b':'w');
  const playerIsMate=pnMoves.length===0&&pnInCheck;
  const playerScore=playerIsMate?100000:-search(pn,2,-Infinity,Infinity);
  const isBest=playerIsMate||playerScore>=bestScore-1;
  const p=st.b[m.from], target=st.b[m.to];
  let brilliant=false;
  if(isBest&&p){
    const pv=VAL[p.k.toLowerCase()];
    const cv=target?VAL[target.k.toLowerCase()]:0;
    const enemyAtt=attacked(pn.b,m.to,st.turn==='w'?'b':'w');
    const defAtt=attacked(pn.b,m.to,st.turn);
    if(enemyAtt&&!defAtt&&pv-cv>=200) brilliant=true;
  }
  if(brilliant) return '!!';
  if(isBest) return '★';
  const delta=bestScore-playerScore;
  if(delta<=20) return '!';
  if(delta<=60) return '';
  if(delta<=180) return '?';
  return '??';
}
function lessonGoalMet(){
  if(!G||!G.lesson||!G.history.length) return false;
  const g=G.lesson.data;
  const last=G.history[G.history.length-1];
  if(!last||!last.move) return false;
  switch(g.goal){
    case 'mate': return false;
    case 'promote': return !!last.move.promo;
    case 'capture': return !!last.capture;
    case 'castle': return last.move.flag==='castleK'||last.move.flag==='castleQ';
    case 'ep': return last.move.flag==='ep';
    case 'check': {
      const k=findKing(G.st.b,G.st.turn);
      return k>=0 && attacked(G.st.b,k,G.st.turn==='w'?'b':'w');
    }
    case 'moves': return G.lesson.progress>=g.n;
  }
  return false;
}
function applyMove(m,opts){
  if(!G) return;
  opts=opts||{};
  const st=G.st;
  const mover=st.turn;
  let quality=null;
  if(opts.human && S.settings.showQuality && G.mode!=='demo' && G.mode!=='replay' && G.mode!=='lesson'){
    try{quality=evalQuality(st,m);}catch(e){quality='';}
  } else if(opts.human && S.settings.showQuality && G.mode==='lesson' && G.lesson.section!=='debuts'){
    try{quality=evalQuality(st,m);}catch(e){quality='';}
  }
  const wasCapture=!!st.b[m.to]||m.flag==='ep';
  const note=notate(st,m);
  const prev=cloneSt(st);
  G.st=makeMove(st,m);
  G.st.last={from:m.from,to:m.to};
  G.history.push({note,quality,mover,prev,move:m,capture:wasCapture});
  if(quality!==null&&G.quality) G.quality[quality]=(G.quality[quality]||0)+1;
  if(!opts.quick){
    if(quality!==null) showQualityMark(m.to,quality);
    if(m.flag==='castleK'||m.flag==='castleQ') SFX.castle();
    else if(wasCapture) SFX.capture();
    else SFX.move();
  }
  if(opts.human&&G.mode!=='demo'&&G.mode!=='replay'){
    if(quality!==null) S.stats.moves[quality]=(S.stats.moves[quality]||0)+1;
    if(wasCapture) S.stats.captures=(S.stats.captures||0)+1;
    if(m.flag==='castleK'||m.flag==='castleQ') S.stats.castles=(S.stats.castles||0)+1;
    if(m.promo) S.stats.promotions=(S.stats.promotions||0)+1;
    if(m.flag==='ep') S.stats.enPassant=(S.stats.enPassant||0)+1;
    save();
  }
  drawBoard(G.st);
  updateMoveList();
  checkGameEnd();
  if(G.mode==='lesson' && G.lesson && G.lesson.data.goal==='mate' && G.lesson.data.mateIn1 && opts.human && !G.over){
    addTrainerMsg('Это не мат. Попробуйте другой ход.');
    G.st=prev; G.history.pop();
    selected=null; legalCache=[]; clearQualityBadge();
    drawBoard(G.st); updateMoveList();
    return;
  }
  if(G.mode==='lesson' && G.lesson && G.lesson.section!=='debuts' && !G.over && opts.human){
    G.lesson.progress=(G.lesson.progress||0)+1;
    const g=G.lesson.data;
    if(g.goal==='moves') addTrainerMsg(`Ход ${G.lesson.progress}/${g.n}.`);
    if(lessonGoalMet()){ finishLesson(true); return; }
  }
  if(G.mode==='online' && opts.human && !opts.remote && !G.over) onlineAfterMove();
}
function checkGameEnd(){
  if(!G||G.over) return;
  const st=G.st;
  const moves=legalMoves(st);
  const k=findKing(st.b,st.turn);
  const inChk=k>=0&&attacked(st.b,k,st.turn==='w'?'b':'w');
  if(!moves.length){
    G.over=true;
    if(inChk){
      const loser=st.turn, winner=loser==='w'?'b':'w';
      if(G.mode==='demo'){statusText('Мат!');return;}
      finishGame(winner===G.human?'win':'lose','Мат');
    } else {
      if(G.mode==='demo'){statusText('Пат — ничья');return;}
      finishGame('draw','Пат');
    }
    return;
  }
  if(st.half>=100){
    G.over=true;
    if(G.mode!=='demo') finishGame('draw','Правило 50 ходов');
    return;
  }
  if((G.mode==='offline'||G.mode==='online') && insufficientMaterial(st.b)){
    G.over=true; finishGame('draw','Недостаточно материала'); return;
  }
  if(inChk) SFX.check();
  if(G.mode!=='demo' && !G.over){
    if(G.mode==='lesson' && G.lesson && G.lesson.section==='debuts') return;
    if(G.mode==='online'){
      if(st.turn!==G.human) statusText('Ход соперника…');
      else statusText('Ваш ход');
      return;
    }
    if(st.turn!==G.human) scheduleBot();
    else {
      statusText(`${t('you')} ${G.human==='w'?t('white'):t('black')} · ваш ход`);
      if(G.mode==='trainer') trainerCommentLast();
    }
  }
}
function insufficientMaterial(b){
  const pieces=[];
  for(let i=0;i<64;i++){const p=b[i];if(p&&p.k.toLowerCase()!=='k')pieces.push({t:p.k.toLowerCase(),sq:i});}
  if(!pieces.length) return true;
  if(pieces.length===1) return pieces[0].t==='n'||pieces[0].t==='b';
  if(pieces.length===2 && pieces.every(p=>p.t==='b')){
    const c1=(pieces[0].sq%8+((pieces[0].sq/8)|0))%2;
    const c2=(pieces[1].sq%8+((pieces[1].sq/8)|0))%2;
    return c1===c2;
  }
  return false;
}
function scheduleBot(){
  if(!G||G.over) return;
  statusText('Бот думает…');
  if(botTimer) clearTimeout(botTimer);
  botTimer=setTimeout(()=>{
    if(!G||G.over) return;
    const elo=G.botElo||400;
    const m=pickMove(G.st,elo);
    if(!m){checkGameEnd();return;}
    applyMove(m,{});
    if(!G.over) statusText(`${t('you')} ${G.human==='w'?t('white'):t('black')} · ваш ход`);
  },260);
}
function statusText(s){$('#statusLine').textContent=s;}
function updateMoveList(){

function undoMove(){
  if(!G || G.mode==='demo' || G.mode==='replay' || !G.history.length) return;
  let steps=0;
  while(G.history.length && steps<2){
    const h=G.history.pop();
    G.st=h.prev;
    steps++;
    if(G.st.turn===G.human) break;
  }
  G.over=false; G.finished=false;
  selected=null; legalCache=[];
  clearQualityBadge();
  drawBoard(G.st);
  updateMoveList();
  statusText('Ход отменён');
  SFX.click();
}
function checkAchievements(){
  let changed=true, allNew=[], iter=0;
  while(changed && iter<3){
    changed=false; iter++;
    for(const a of ACHIEVEMENTS){
      if(S.achievements[a.id]) continue;
      let ok=false;
      try{ok=a.check();}catch(e){}
      if(ok){
        S.achievements[a.id]=true;
        S.stars=(S.stars||0)+a.reward;
        S.stats.starsEarned=(S.stats.starsEarned||0)+a.reward;
        allNew.push(a); changed=true;
      }
    }
  }
  if(allNew.length){
    save();
    if(allNew.length===1){
      const a=allNew[0];
      toast(`Достижение: ${a.name} (+${a.reward}★)`);
    } else {
      const total=allNew.reduce((s,a)=>s+a.reward,0);
      toast(`${allNew.length} достижений! +${total}★`);
    }
    SFX.win();
  }
  return allNew;
}
function gainXp(amount){
  if(!amount||amount<=0) return;
  S.xp=(S.xp||0)+amount;
  const claimed=S.claimedMastery||[];
  for(let i=0;i<MASTERY.length;i++){
    if(S.xp>=MASTERY[i].xp && !claimed.includes(i)){
      claimed.push(i);
      applyMasteryReward(MASTERY[i].reward);
    }
  }
  S.claimedMastery=claimed;
  save();
  checkAchievements();
}
function applyMasteryReward(reward){
  if(!reward) return;
  if(reward.stars){
    S.stars=(S.stars||0)+reward.stars;
    S.stats.starsEarned=(S.stats.starsEarned||0)+reward.stars;
  }
  if(reward.boardSkin!==undefined && !S.owned.board.includes(reward.boardSkin)) S.owned.board.push(reward.boardSkin);
  if(reward.pieceSkin!==undefined && !S.owned.piece.includes(reward.pieceSkin)) S.owned.piece.push(reward.pieceSkin);
  if(reward.avatar && !S.inventory.avatars.includes(reward.avatar)) S.inventory.avatars.push(reward.avatar);
  if(reward.frame && !S.inventory.frames.includes(reward.frame)) S.inventory.frames.push(reward.frame);
}

/* ================= GAME END ================= */
function finishGame(result,reason){
  if(!G||(G.over&&G.finished)) return;
  if(G.lesson){ finishLesson(result!=='lose'); return; }
  G.finished=true; G.over=true; G.result=result;
  G.resultText=(result==='win'?t('win'):result==='lose'?t('lose'):t('draw'))+(reason?' · '+reason:'');
  if(G.mode==='online'){ finishOnlineGame(result,reason); return; }

  let starsGain=0, crownGain=0;
  const elo=G.botElo||100;
  const q=G.quality||{};
  if(result==='win'){
    let gain=elo+(q['!!']||0)*100+(q['★']||0)*25+(q['!']||0)*10
             -((q['?']||0)+(q['??']||0))*15-(q['']||0)*30;
    gain=Math.max(elo/2, Math.round(gain));
    starsGain=gain;
    crownGain=Math.round(elo/100);
    S.crowns=Math.max(0,S.crowns+crownGain);
    S.stars=Math.max(0,S.stars+starsGain);
    S.stats.starsEarned=(S.stats.starsEarned||0)+Math.max(0,starsGain);
    S.stats.crownsEarned=(S.stats.crownsEarned||0)+Math.max(0,crownGain);
    if(G.mode==='offline' && typeof G.botIndex==='number'){
      S.unlocked=Math.max(S.unlocked, Math.min(BOTS.length, G.botIndex+2));
      S.stats.botWins[G.botIndex]=(S.stats.botWins[G.botIndex]||0)+1;
    }
  } else if(result==='lose'){
    crownGain=-Math.round(1000/elo);
    S.crowns=Math.max(0,S.crowns+crownGain);
  }
  S.stats.gamesPlayed=(S.stats.gamesPlayed||0)+1;
  if(result==='win'){ S.stats.wins=(S.stats.wins||0)+1; if(reason==='Мат') S.stats.matesDelivered=(S.stats.matesDelivered||0)+1; }
  else if(result==='lose') S.stats.losses=(S.stats.losses||0)+1;
  else S.stats.draws=(S.stats.draws||0)+1;
  save();
  if(result==='win') SFX.win(); else if(result==='lose') SFX.lose(); else SFX.click();

  let xpGain=0;
  if(result==='win'){
    const eloPlayer=S.playerElo||100;
    xpGain=Math.max(1, Math.round(starsGain*10/eloPlayer));
    gainXp(xpGain);
  }
  checkAchievements();

  showModal(result==='win'?t('win'):result==='lose'?t('lose'):t('draw'),
    `<div style="font-size:14px;font-weight:700;margin-bottom:6px">${G.resultText}</div>
     <div style="color:var(--muted);line-height:1.9">
       Соперник: бот ${G.botElo} ELO<br>
       ${result==='win'?`Звёзды: <b style="color:var(--accent)">+${fmt(starsGain)}</b><br>`:''}
       ${result==='win'?`Короны: <b style="color:var(--accent)">+${crownGain}</b><br>`:''}
       ${result==='win'&&xpGain>0?`Опыт: <b style="color:var(--accent)">+${xpGain} XP</b><br>`:''}
       ${result==='lose'?`Короны: <b style="color:#e06a6a">${crownGain}</b><br>`:''}
       Всего звёзд: <b>${fmt(S.stars)}</b> · корон: <b>${fmt(S.crowns)}</b>
     </div>`,
    [
      {label:'Ещё раз',onClick:()=>{closeModal(); startOfflineGame(G.botIndex!==undefined?G.botIndex:0);}},
      {label:t('save'),onClick:()=>{closeModal(); openSaveDialog();}},
      {label:'В меню',primary:true,onClick:()=>{closeModal(); stopDemo(); startDemo();}}
    ]);
}
function finishLesson(win){
  if(!G||!G.lesson) return;
  if(G.finished) return;
  clearHints();
  G.over=true; G.finished=true; G.result=win?'win':'lose';
  if(win) completeLesson(G.lesson.section, G.lesson.index);
  if(win) SFX.win(); else SFX.lose();
  const next=G.lesson.index+1;
  const hasNext=next<LESSONS[G.lesson.section].length;
  showModal(win?'Этап пройден!':'Попробуйте ещё раз',
    `<div style="font-size:14px;font-weight:700;margin-bottom:6px">${LESSONS[G.lesson.section][G.lesson.index][0]}</div>
     <div style="color:var(--muted);line-height:1.7">
       ${win?'Цель выполнена.':'Задание не выполнено.'}
     </div>`,
    [
      ...(win&&hasNext?[{label:'Следующий',primary:true,onClick:()=>{closeModal(); openLesson(G.lesson.section,next);}}]:[]),
      {label:'Повторить',onClick:()=>{closeModal(); openLesson(G.lesson.section,G.lesson.index);}},
      {label:'В меню',onClick:()=>{closeModal(); stopDemo(); startDemo();}}
    ]);
}
function completeLesson(section,i){
  if(!S.lessons[section].includes(i)){
    S.lessons[section].push(i);
    S.lessons[section].sort((a,b)=>a-b);
    save();
    checkAchievements();
    toast('Этап пройден!');
  }
}

function startReplay(game){
  stopDemo(); clearQualityBadge(); clearHints();
  orientation='w'; buildSquares();
  G = {
    mode:'replay',
    st: parseFEN(game.startFen || START_FEN),
    startFen: game.startFen || START_FEN,
    human: null, over: true, finished: true,
    history: [], quality: game.quality || {},
    replay: { game, index: 0, playing: true, timer: null, speed: 700 }
  };
  selected = null; legalCache = [];
  drawBoard(G.st);
  updateMoveList();
  updateGameUI();
  statusText(`Реплей · ${game.date || ''}`);
  scheduleReplayStep();
}
function scheduleReplayStep(){
  if(!G || !G.replay) return;
  const r = G.replay;
  if(r.timer) clearTimeout(r.timer);
  r.timer = setTimeout(replayStep, r.speed);
}
function replayStep(){
  if(!G || !G.replay) return;
  const r = G.replay;
  if(!r.playing) return;
  if(r.index >= r.game.moves.length){
    r.playing = false;
    statusText(`Реплей завершён · ${r.game.resultText || ''}`);
    updateReplayUI();
    return;
  }
  const info = r.game.moves[r.index];
  const move = sanToMove(G.st, info.note);
  if(!move){
    statusText(`Не удалось разобрать ход: ${info.note}`);
    r.playing = false;
    updateReplayUI();
    return;
  }
  applyReplayMove(move, info);
  r.index++;
  updateReplayUI();
  if(r.index >= r.game.moves.length){
    r.playing = false;
    statusText(`Реплей завершён · ${r.game.resultText || ''}`);
    return;
  }
  scheduleReplayStep();
}
function applyReplayMove(m, info){
  const prev = cloneSt(G.st);
  const wasCapture = !!G.st.b[m.to] || m.flag === 'ep';
  G.st = makeMove(G.st, m);
  G.st.last = {from: m.from, to: m.to};
  G.history.push({note: info.note, quality: info.quality, mover: info.mover, prev, move: m, capture: wasCapture});
  if(m.flag === 'castleK' || m.flag === 'castleQ') SFX.castle();
  else if(wasCapture) SFX.capture();
  else SFX.move();
  drawBoard(G.st);
  updateMoveList();
  if(info.quality) showQualityMark(m.to, info.quality);
}
function updateReplayUI(){
  const bar = $('#gameBar');
  if(!G || G.mode !== 'replay') return;
  bar.innerHTML = '';
  const r = G.replay;
  const mk = (label, fn) => {
    const b = document.createElement('button');
    b.className = 'sbtn'; b.textContent = label;
    b.onclick = () => { SFX.click(); fn(); };
    bar.appendChild(b);
  };
  mk('⏮', () => replayReset());
  mk(r.playing ? '⏸' : '▶', () => {
    r.playing = !r.playing;
    if(r.playing) scheduleReplayStep();
    else if(r.timer) clearTimeout(r.timer);
    updateReplayUI();
  });
  mk('⏭', () => replayStep());
  mk('✕ Закрыть', () => stopReplay());
  statusText(`Реплей ${r.index}/${r.game.moves.length} · ${r.game.resultText || ''}`);
}
function replayReset(){
  if(!G || !G.replay) return;
  const r = G.replay;
  if(r.timer) clearTimeout(r.timer);
  G.st = parseFEN(r.game.startFen || START_FEN);
  G.history = [];
  r.index = 0;
  r.playing = true;
  selected = null; legalCache = [];
  clearQualityBadge();
  drawBoard(G.st);
  updateMoveList();
  updateReplayUI();
  scheduleReplayStep();
}
function stopReplay(){
  if(G && G.replay && G.replay.timer) clearTimeout(G.replay.timer);
  startDemo();
}

/* ================= POINTER ================= */
let pointer={down:false,sq:-1,x:0,y:0,moved:false,dragEl:null,dragId:null,dragFrom:-1,prevSelected:null};
function squareFromEvent(e){
  const r=boardEl.getBoundingClientRect();
  const x=e.clientX-r.left,y=e.clientY-r.top;
  if(x<0||y<0||x>=r.width||y>=r.height) return -1;
  const f=Math.min(7,Math.floor(x/(r.width/8)));
  const rk=Math.min(7,Math.floor(y/(r.height/8)));
  return viewToBoard(rk*8+f);
}
function humanCanMove(){
  if(!G||G.over) return false;
  if(G.mode==='demo'||G.mode==='replay') return false;
  return G.st.turn===G.human;
}
boardEl.addEventListener('pointerdown',e=>{
  if(!G) return;
  const sq=squareFromEvent(e);
  if(sq<0) return;
  pointer={down:true,sq,x:e.clientX,y:e.clientY,moved:false,dragEl:null,dragId:null,dragFrom:-1,prevSelected:selected};
  if(!humanCanMove()) return;
  const p=G.st.b[sq];
  if(p && ((p.k<'a')?'w':'b')===G.st.turn){
    selected=sq; legalCache=legalMoves(G.st);
    updateVisualsOnly();
    const el=pieceEls.get(p.id);
    if(el){pointer.dragEl=el;pointer.dragId=p.id;pointer.dragFrom=sq;}
  }
  try{boardEl.setPointerCapture(e.pointerId);}catch(err){}
});
window.addEventListener('pointermove',e=>{
  if(!pointer.down||!pointer.dragEl) return;
  const dx=e.clientX-pointer.x,dy=e.clientY-pointer.y;
  if(!pointer.moved&&Math.hypot(dx,dy)<5) return;
  if(!pointer.moved){pointer.moved=true;pointer.dragEl.classList.add('drag');}
  const r=boardEl.getBoundingClientRect();
  const cell=r.width/8;
  const cx=(e.clientX-r.left)/cell-0.5;
  const cy=(e.clientY-r.top)/cell-0.5;
  pointer.dragEl.style.transform=`translate(${cx*100}%, ${cy*100}%)`;
});
window.addEventListener('pointerup',e=>{
  if(!pointer.down) return;
  const wasDrag=pointer.moved;
  const dragEl=pointer.dragEl, from=pointer.dragFrom;
  pointer.down=false;
  if(!G){if(dragEl)dragEl.classList.remove('drag');return;}
  if(!humanCanMove()){
    if(dragEl)dragEl.classList.remove('drag');
    selected=null;legalCache=[];drawBoard(G.st);return;
  }
  if(wasDrag){
    if(dragEl) dragEl.classList.remove('drag');
    const to=squareFromEvent(e);
    if(to>=0&&to!==from){
      const mv=legalMoves(G.st).find(m=>m.from===from&&m.to===to);
      if(mv){doHumanMove(mv);return;}
    }
    if(dragEl) dragEl.style.transform=posTransform(from);
    selected=null; legalCache=[];
    updateVisualsOnly();
    return;
  }
  if(dragEl) dragEl.classList.remove('drag');
  const sq=pointer.sq;
  const prevSel=pointer.prevSelected;
  if(sq<0){selected=null;legalCache=[];updateVisualsOnly();return;}
  if(prevSel!=null && prevSel!==sq){
    const mv=legalMoves(G.st).find(m=>m.from===prevSel&&m.to===sq);
    if(mv){doHumanMove(mv);return;}
  }
  const p=G.st.b[sq];
  if(p&&((p.k<'a')?'w':'b')===G.st.turn){
    if(prevSel===sq){selected=null;legalCache=[];}
    else{selected=sq;legalCache=legalMoves(G.st);SFX.click();}
  } else {selected=null;legalCache=[];}
  updateVisualsOnly();
});
window.addEventListener('pointercancel',()=>{
  if(pointer.dragEl){
    pointer.dragEl.classList.remove('drag');
    if(pointer.dragFrom>=0) pointer.dragEl.style.transform=posTransform(pointer.dragFrom);
  }
  pointer.down=false;
});
function doHumanMove(m){
  if(G && G.mode==='lesson' && G.lesson && G.lesson.section==='debuts'){
    const expectedSan=G.lesson.line[G.lesson.linePos];
    const expectedMove=sanToMove(G.st, expectedSan);
    const correct = expectedMove &&
      expectedMove.from===m.from && expectedMove.to===m.to &&
      (expectedMove.promo||null)===(m.promo||null);
    if(!correct){
      SFX.error();
      addTrainerMsg(`Ожидался ход ${expectedSan}. Попробуйте ещё раз.`);
      selected=null;legalCache=[];drawBoard(G.st);
      return;
    }
    selected=null; legalCache=[];
    applyMove(expectedMove&&m.promo?expectedMove:m,{human:true});
    G.lesson.linePos++;
    if(G.lesson.linePos>=G.lesson.line.length){finishLesson(true);return;}
    updateDebutHint();
    setTimeout(()=>playDebutBotMove(), 400);
    return;
  }
  selected=null; legalCache=[];
  if(m.promo){ showPromotionPicker(m); return; }
  applyMove(m,{human:true});
}
function showPromotionPicker(m){
  const p=showModal('Превращение пешки',
    `<div class="promo-row">${[['q','Ферзь'],['r','Ладья'],['b','Слон'],['n','Конь']].map(([k,n])=>
      `<button class="promo-btn" data-p="${k}" title="${n}">${GLYPH[k]}</button>`).join('')}</div>`,[]);
  p.querySelectorAll('[data-p]').forEach(b=>{
    b.onclick=()=>{
      const mp=b.dataset.p;
      closeModal(); SFX.click();
      if(!G||G.over) return;
      applyMove(Object.assign({},m,{promo:mp}),{human:true});
    };
  });
}
function playDebutBotMove(){
  if(!G || G.mode!=='lesson' || !G.lesson.line) return;
  if(G.over) return;
  if(G.lesson.linePos>=G.lesson.line.length){finishLesson(true);return;}
  const san=G.lesson.line[G.lesson.linePos];
  const move=sanToMove(G.st, san);
  if(!move){addTrainerMsg('Разбор линии окончен.');setTimeout(()=>finishLesson(true),400);return;}
  applyMove(move,{});
  G.lesson.linePos++;
  if(G.lesson.linePos>=G.lesson.line.length){setTimeout(()=>finishLesson(true),500);return;}
  const expected=G.lesson.line[G.lesson.linePos];
  addTrainerMsg(`Следующий ход: ${expected}`, true);
  statusText(`Урок · сыграйте ${expected}`);
  updateDebutHint();
}

  const p=showModal('Магазин',render(),[],true);
  const bind=()=>{
    p.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
      SFX.click();tab=b.dataset.tab;
      p.querySelector('.modal-body').innerHTML=render();bind();
    });
    p.querySelectorAll('.card').forEach(card=>{
      card.querySelector('button').onclick=e=>{
        e.stopPropagation();
        const i=+card.dataset.i;
        const kind=card.dataset.kind||card.dataset.tab;
        if(isSkinTab(kind)){
          const data=kind==='board'?BOARD_SKINS:kind==='piece'?PIECE_SKINS:SOUND_SKINS;
          const it=data[i];
          const owned=S.owned[kind];
          if(owned.includes(i)){S.equipped[kind]=i;save();applySettings();SFX.click();}
          else if(it.premiumOnly&&!isPremium()){SFX.error();toast('Только для Premium');}
          else if(it.rarity==='secret'){SFX.error();toast('Открывается за уровень мастерства');}
        } else if(kind==='frames'){
          const it=SHOP_DATA.frames[i];
          if(!it) return;
          if(it.premium&&!isPremium()){SFX.error();toast('Только для Premium');return;}
          S.equipped.frame=it.id;save();SFX.click();setAccountName(S.username);toast('Надето: '+it.name);
        } else if(kind==='prefixes'){
          const it=SHOP_DATA.prefixes[i];
          if(!it) return;
          if(it.premium&&!isPremium()){SFX.error();toast('Только для Premium');return;}
          S.equipped.prefix=it.id;save();SFX.click();setAccountName(S.username);toast('Надето: '+it.name);
        } else if(kind==='avatars'){
          const it=SHOP_DATA.avatars[i];
          if(!it) return;
          S.equipped.avatar=it.id;save();SFX.click();toast('Надето: '+it.name);
        }
        p.querySelector('.modal-body').innerHTML=render();bind();
      };
    });
  };
  bind();
}

          <select id="selTLang">

            <option value="en" ${S.settings.trainerLang==='en'?'selected':''}>English</option>
          </select></div>`;
    } else {
      const sw=(id,on)=>`<div class="switch ${on?'on':''}" data-key="${id}"></div>`;
      body=`
        <div class="setRow"><span>Показывать съеденные фигуры</span>${sw('showCaptured',S.settings.showCaptured)}</div>

        <div class="setRow"><span>Подсказки возможных ходов</span>${sw('hints',S.settings.hints)}</div>
        <div class="setRow"><span>Анимации</span>${sw('animations',S.settings.animations)}</div>

      <button class="tab ${tab==='game'?'on':''}" data-tab="game">Геймплей</button>

          st=p.querySelector('#selTheme'),sa=p.querySelector('#selAccent'),
          sl=p.querySelector('#selLang'),stl=p.querySelector('#selTLang');
    if(sb) sb.onchange=()=>{S.equipped.board=+sb.value;save();applySettings();};
    if(sp) sp.onchange=()=>{S.equipped.piece=+sp.value;save();applySettings();};
    if(ss) ss.onchange=()=>{S.equipped.sound=+ss.value;save();SFX.click();};
    if(st) st.onchange=()=>{S.settings.theme=st.value;save();applySettings();};
    if(sa) sa.oninput=()=>{S.settings.accent=sa.value;save();applySettings();};
    if(sl) sl.onchange=()=>{S.settings.lang=sl.value;LANG=sl.value;save();applyI18N();};
    if(stl) stl.onchange=()=>{S.settings.trainerLang=stl.value;save();};
    p.querySelectorAll('.switch').forEach(sw=>{
      sw.onclick=()=>{
        const k=sw.dataset.key;

        save();applySettings();SFX.click();
        if(k==='showMoves'||k==='showCaptured'){updateGameUI();if(G)drawBoard(G.st);}
      };
    });
  };
  const refresh=()=>{p.querySelector('.modal-body').innerHTML=render();bind();};
  bind();
}

function openTrainerSetup(){
  const p=showModal('Тренер',
    `<div style="margin-bottom:8px;color:var(--muted);font-size:12px">Выберите силу противника:</div>

    const b=document.createElement('button');

function startTrainerGame(elo){
  stopDemo(); clearQualityBadge(); clearHints();
  const human=Math.random()<0.5?'w':'b';
  orientation=human; buildSquares();
  G={mode:'trainer', st:newGameState(), startFen:START_FEN, human, botElo:elo, over:false, finished:false,
     history:[], comments:[], quality:{'!!':0,'★':0,'!':0,'':0,'?':0,'??':0}};
  selected=null; legalCache=[];
  drawBoard(G.st); updateMoveList(); updateGameUI();
  statusText(`${t('you')} ${human==='w'?t('white'):t('black')} · тренер ${elo} ELO`);
  addTrainerMsg('Привет! Я ваш тренер. Играйте спокойно, я буду подсказывать по ходу партии.');
  if(G.st.turn!==human) scheduleBot();
}
function addTrainerMsg(txt,isGoal){
  if(!G) return;
  if(!G.comments) G.comments=[];
  G.comments.push({text:txt, goal:!!isGoal});
  renderTrainerBox();
}
function renderTrainerBox(){
  const box=$('#trainerBox');
  if(!G||!G.comments){box.innerHTML='';return;}
  box.innerHTML=G.comments.slice(-8).map(c=>{
    const txt=typeof c==='string'?c:c.text;
    const cls=(c&&c.goal)?'msg goal':'msg';
    return `<div class="${cls}">${txt}</div>`;
  }).join('');
  box.scrollTop=box.scrollHeight;
}
const TRAINER_TEXT={
  '!!':['Бриллиантовый ход! Такая жертва — большая редкость.','Великолепно! Вы отдали материал, но получили решающую инициативу.'],
  '★':['Лучший ход в позиции. Отлично!','Именно так — это сильнейшее продолжение.'],
  '!':['Хороший ход, продолжайте в том же духе.','Крепкий ход, позиция улучшается.'],
  '':['Нормальный ход. Держите фигуры активными.','Приемлемо. Следите за центром.'],
  '?':['Неточно. Проверьте, не висит ли фигура.','Есть вариант сильнее — ищите форсированные ходы.'],
  '??':['Ошибка! Соперник может этим воспользоваться.','Зевок. В таких позициях считайте до конца.']
};
function trainerCommentLast(){
  if(!G||G.mode!=='trainer') return;
  const last=G.history[G.history.length-1];
  if(!last||last.mover!==G.human) return;
  const arr=TRAINER_TEXT[last.quality||'']||TRAINER_TEXT[''];
  addTrainerMsg(arr[Math.random()*arr.length|0]);
}
function openTheory(section){
  const data=LESSONS[section];
  const done=S.lessons[section];
  let html='<div style="margin-bottom:6px;color:var(--muted);font-size:12px">Этапы открываются по порядку.</div>';
  data.forEach((ls,i)=>{
    const unlocked=i===0||done.includes(i-1)||done.includes(i);
    const isDone=done.includes(i);
    html+=`<div class="listRow ${unlocked?'':'locked'}" data-i="${i}">
      <div class="nm">${i+1}. ${ls[0]}<div class="sub">${isDone?'пройдено':unlocked?'доступно':'закрыто'}</div></div>
      <span class="badge">${isDone?'✓':unlocked?'открыть':'закрыто'}</span>
    </div>`;
  });
  const p=showModal(section==='basics'?'Теория · Основы':section==='debuts'?'Теория · Дебюты':'Теория · Маты', html, []);
  p.querySelectorAll('.listRow').forEach(r=>{
    r.onclick=()=>{
      const i=+r.dataset.i;
      const doneArr=S.lessons[section];
      const unlocked=i===0||doneArr.includes(i-1)||doneArr.includes(i);
      if(!unlocked){SFX.error();toast('Сначала пройдите предыдущий этап');return;}
      SFX.click(); openLesson(section,i);
    };
  });
}
function openLesson(section,i){
  const ls=LESSONS[section][i];
  const isDone=S.lessons[section].includes(i);
  let body=`<div style="line-height:1.7">${ls[1]}</div>`;
  if(section==='debuts'){
    const line=parseOpeningLine(ls[1]);
    body+=`<div style="margin-top:12px;padding:9px 11px;background:var(--panel2);border-radius:9px;font-size:12px">
      <b>Линия:</b> ${line.join(' ')}<br>
      <b>Вы играете:</b> ${i<15?'белыми':'чёрными'}
    </div>`;
  } else {
    const data=LESSON_PRACTICE[section][i];
    body+=`<div style="margin-top:12px;padding:9px 11px;background:var(--panel2);border-radius:9px;font-size:12px">
      <b>Цель:</b> ${goalDescription(data)}
    </div>`;
  }
  if(isDone) body+='<div style="margin-top:8px;color:var(--accent);font-size:12px"><b>✓ Этап уже пройден</b></div>';
  showModal(`${i+1}. ${ls[0]}`, body,
    [{label:isDone?'Повторить':'Практика',primary:true,onClick:()=>{closeModal();startLesson(section,i);}}]);
}
function startLesson(section,i){
  stopDemo(); clearQualityBadge(); clearHints();
  const data=LESSON_PRACTICE[section][i];
  let startFEN, human, elo, line=null;
  if(section==='debuts'){
    human = i<15?'w':'b';
    elo=400;
    startFEN=START_FEN;
    line=parseOpeningLine(LESSONS.debuts[i][1]);
  } else {
    human='w';
    elo = section==='basics'?200:600;
    startFEN=data.fen;
  }
  orientation=human; buildSquares();
  G={mode:'lesson', st:parseFEN(startFEN), startFen:startFEN, human, botElo:elo, over:false, finished:false,
     history:[], comments:[], quality:{'!!':0,'★':0,'!':0,'':0,'?':0,'??':0},
     lesson:{section, index:i, data, progress:0, line, linePos:0}};
  selected=null; legalCache=[];
  drawBoard(G.st); updateMoveList(); updateGameUI();
  $('#trainerBox').style.display='block';
  addTrainerMsg(`Этап ${i+1}: ${LESSONS[section][i][0]}.`);
  addTrainerMsg(LESSONS[section][i][1]);
  if(line){
    if(human==='b'){
      setTimeout(()=>playDebutBotMove(), 500);
    } else {
      const expected=line[0];
      addTrainerMsg(`Сыграйте ход: ${expected}`, true);
      statusText(`Урок · сыграйте ${expected}`);
    }
  } else {
    addTrainerMsg('Цель: '+goalDescription(data), true);
    statusText(`Урок · цель: ${goalDescription(data)}`);
    if(G.st.turn!==human) scheduleBot();
  }
  updateDebutHint();
}

/* ================= ACHIEVEMENTS ================= */
function openAchievements(){
  const unlocked=S.achievements||{};
  const total=ACHIEVEMENTS.length;
  const unlockedCount=ACHIEVEMENTS.filter(a=>unlocked[a.id]).length;
  const sorted=[...ACHIEVEMENTS].sort((a,b)=>{
    const ra=RARITIES.findIndex(r=>r.key===achRarity(a));
    const rb=RARITIES.findIndex(r=>r.key===achRarity(b));
    return rb-ra;
  });
  let html=`<div style="margin-bottom:8px;color:var(--muted);font-size:12px">Открыто ${unlockedCount} из ${total}</div>
    <div style="height:7px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-bottom:12px">
      <div style="height:100%;width:${unlockedCount/total*100}%;background:var(--accent);transition:width .3s"></div>
    </div>`;
  sorted.forEach(a=>{
    const isUnlocked=!!unlocked[a.id];
    const rar = RARITY_BY_KEY[achRarity(a)];
    html+=`<div class="listRow" style="opacity:${isUnlocked?1:.5}">
      <div class="nm">${a.name}<div class="sub">${a.desc}</div></div>
      <div style="text-align:right;min-width:80px">
        <div style="font-size:9.5px;font-weight:700;text-transform:uppercase;color:${rar.color}">${rar.name}</div>
        <div style="font-size:11px;color:var(--accent)">${isUnlocked?'✓ ':'+'}${a.reward}★</div>
      </div>
    </div>`;
  });
  showModal('Достижения', html, [{label:'Закрыть',primary:true,onClick:closeModal}], true);
}

/* ================= MASTERY MENU ================= */
function openMastery(){
  const xp=S.xp||0;
  const cur=getMasteryLevel(xp);
  const next=MASTERY[cur.index+1];
  const prevXp=cur.xp;
  const nextXp=next?next.xp:prevXp;
  const progress=next?Math.min(1,(xp-prevXp)/(nextXp-prevXp)):1;
  let html=`
    <div style="text-align:center;margin-bottom:12px">
      <div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em">Уровень мастерства</div>
      <div style="font-size:24px;font-weight:800">${cur.level} · ${cur.name}</div>
      <div style="font-size:12px;color:var(--muted);margin-top:3px">${xp} XP${next?` · до следующего ${nextXp-xp}`:' · максимум'}</div>
    </div>
    <div style="height:10px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-bottom:14px">
      <div style="height:100%;width:${progress*100}%;background:var(--accent);transition:width .3s"></div>
    </div>
    <div class="mastery-track">`;
  MASTERY.forEach((m,i)=>{
    const reached=xp>=m.xp;
    const isCur=i===cur.index;
    html+=`<div class="mastery-node ${reached?'reached':''} ${isCur?'current':''}">
      <div class="lvl">Ур. ${i+1}</div>
      <div class="nm">${m.name}</div>
      <div class="rw">${formatMasteryReward(m.reward)}</div>
      <div class="xp">${m.xp} XP</div>
    </div>`;
  });
  html+=`</div>`;
  showModal('Мастерство', html, [{label:'Закрыть',primary:true,onClick:closeModal}], true);
}

      const gi=+r.dataset.gi;
      closeModal();
      startReplay(c.games[gi]);

    }
  };
}

function lum(hex){
  const c=hex.replace('#','');
  const r=parseInt(c.substr(0,2),16),g=parseInt(c.substr(2,2),16),b=parseInt(c.substr(4,2),16);
  return (0.299*r+0.587*g+0.114*b)/255;
}
function applySettings(){
  document.body.dataset.theme=S.settings.theme;
  document.documentElement.style.setProperty('--accent',S.settings.accent);
  document.documentElement.style.setProperty('--accent-fg',lum(S.settings.accent)>0.55?'#101010':'#ffffff');

  document.documentElement.style.setProperty('--sq-light',bs.c1);

/* ================= ONLINE ================= */
function emailFor(u){
  const low=String(u||'').toLowerCase();
  if(/^[a-z0-9._-]+$/.test(low)) return low+'@chez.game';
  return 'u_'+Array.from(low).map(c=>c.codePointAt(0).toString(36)).join('')+'@chez.game';
}
async function restoreSession(session){
  if(!supabase||!session||!session.user) return;
  try{
    const {data:profile,error}=await supabase.from('profiles').select('*').eq('id',session.user.id).maybeSingle();
    if(profile){syncProfile(profile);return;}
    const fallbackName=S.username||(session.user.email||'').split('@')[0]||('Игрок'+Math.floor(1000+Math.random()*9000));
    currentUser={id:session.user.id,username:fallbackName,rating:Number(S.rating)||1000,stars:S.stars||0,xp:S.xp||0};
    isOnline=true; S.username=fallbackName; setAccountName(fallbackName);
    const np={id:session.user.id,username:fallbackName,rating:Number(S.rating)||1000,
      stars:S.stars||0,xp:S.xp||0};
    const img=safeImgUrl(S.avatar_url);
    if(img)np.avatar_url=img;
    if(profileWritable){
      const r=await supabase.from('profiles').upsert(np,{onConflict:'id'});
      if(!r.error) syncProfile(np);
      else if(r.error.code==='42501') profileWritable=false;
    }
  }catch(e){}
}
function syncProfile(p){
  if(!p) return;
  currentUser=p; isOnline=true;
  S.username=p.username||S.username||'';
  const serverHasProgress=!!(Number(p.stars)||Number(p.crowns)||Number(p.xp)||(p.stats&&Number(p.stats.gamesPlayed))||(Number(p.rating)&&Number(p.rating)!==1000));
  S.rating=Number(p.rating)||S.rating||1000;
  if(serverHasProgress){
    S.stars=Math.max(Number(S.stars)||0,Number(p.stars)||0);
    S.xp=Math.max(Number(S.xp)||0,Number(p.xp)||0);
  }
  S.is_mod=!!p.is_mod; S.is_banned=!!p.is_banned;
  S.is_premium=!!p.is_premium;
  S.avatar_url=safeImgUrl(p.avatar_url)||S.avatar_url;
  setAccountName(S.username);
  save();
  if(G)updateGameUI();
}

      reader.onload=async ev=>{
        const url=safeImgUrl(ev.target.result);
        if(!url)return toast('Неподдерживаемый формат');

    const msg=p.querySelector('#authMsg');

    p.querySelector('#btnLogin').onclick=async()=>{
      const {u,pass}=readAuth();
      if(!u||!pass){msg.style.color='#e06a6a';msg.textContent='Введите имя и пароль';return;}
      msg.style.color='#ffd84d';msg.textContent='Вход…';
      const {data,error}=await supabase.auth.signInWithPassword({email:emailFor(u),password:pass});

      msg.style.color='#ffd84d';msg.textContent='Регистрация…';
      const {data,error}=await supabase.auth.signUp({email:emailFor(u),password:pass});
      if(error){msg.style.color='#e06a6a';msg.textContent='Ошибка: '+error.message;return;}
      if(!data.user){msg.style.color='#e06a6a';msg.textContent='Проверьте почту для подтверждения';return;}
      if(!data.session){
        msg.style.color='#ffd84d';msg.textContent='Аккаунт создан. Подтвердите почту и войдите.';
        return;
      }
      const np={id:data.user.id,username:u,rating:Number(S.rating)||1000,
        stars:S.stars||0,xp:S.xp||0,is_premium:false,is_mod:false};
      const ins=await supabase.from('profiles').upsert(np,{onConflict:'id'});
      if(ins.error){
        if(ins.error.code==='42501')profileWritable=false;
        currentUser={id:data.user.id,username:u,rating:Number(S.rating)||1000,stars:S.stars||0,xp:S.xp||0};
        isOnline=true;S.username=u;setAccountName(u);
        msg.style.color='#7cd4a3';msg.textContent='Аккаунт создан!';
      } else {
        syncProfile(np);
        msg.style.color='#7cd4a3';msg.textContent='Аккаунт создан!';
      }
      setTimeout(closeModal,600);
    };
  }
}
