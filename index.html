     <div style="display:flex;gap:8px">
       <input type="text" id="joinCode" class="authInput" style="margin:0;text-transform:uppercase" maxlength="6" placeholder="Код комнаты">
       <button class="btn" id="btnJoinRoom" style="width:90px">Войти</button>
     </div>
     <div id="roomInfo" style="margin-top:14px;text-align:center;color:#7cd4a3;min-height:20px;font-size:13px"></div>`,[]);
  let selTime=600;
  p.querySelectorAll('[data-time]').forEach(b=>{
    b.onclick=()=>{
      p.querySelectorAll('[data-time]').forEach(x=>x.classList.remove('primary'));
      b.classList.add('primary');selTime=parseInt(b.dataset.time,10);
    };
  });
  const def=p.querySelector('[data-time="600"]');if(def)def.classList.add('primary');
  const info=p.querySelector('#roomInfo');
  const randomCode=()=>{
    const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let c='';for(let i=0;i<4;i++)c+=chars[Math.floor(Math.random()*chars.length)];
    return c;
  };
  const createRoom=async t=>{
    info.style.color='#ffd84d';info.textContent='Создание…';
    const code=randomCode();
    const {error}=await supabase.from('rooms').insert({
      code,host_id:currentUser.id,status:'waiting',time_control:t,
      white_time:t*1000,black_time:t*1000,fen:START_FEN,draw_offer_by:null
    });
    if(error){info.style.color='#e06a6a';info.textContent='Ошибка: '+error.message;return;}
    info.style.color='#7cd4a3';
    info.innerHTML=`Код: <b style="font-size:20px;color:#fff">${esc(code)}</b><br>Ожидание соперника…`;
    if(lobbyChannel&&supabase){try{supabase.removeChannel(lobbyChannel);}catch(e){}lobbyChannel=null;}
    lobbyChannel=supabase.channel('lobby-'+code).on('postgres_changes',
      {event:'UPDATE',schema:'public',table:'rooms',filter:`code=eq.${code}`},pl=>{
        if(pl.new&&pl.new.status==='playing'){
          try{supabase.removeChannel(lobbyChannel);}catch(e){}lobbyChannel=null;
          closeModal();
          startOnlineGame(code,'w',pl.new.fen,pl.new.time_control);
        }
      }).subscribe();
  };
  p.querySelector('#btnCreateRoom').onclick=()=>createRoom(selTime);
  p.querySelector('#btnRandomRoom').onclick=async()=>{
    info.style.color='#ffd84d';info.textContent='Поиск соперника…';
    const {data:rooms,error}=await supabase.from('rooms').select('*')
      .eq('status','waiting').neq('host_id',currentUser.id).order('created_at',{ascending:true}).limit(1);
    if(error){info.style.color='#e06a6a';info.textContent='Ошибка: '+error.message;return;}
    if(!rooms||!rooms.length){info.style.color='#ffd84d';info.textContent='Свободных комнат нет. Создайте свою!';return;}
    const room=rooms[0];
    const {error:e2}=await supabase.from('rooms').update({guest_id:currentUser.id,status:'playing',draw_offer_by:null})
      .eq('code',room.code).eq('status','waiting');
    if(e2){info.style.color='#e06a6a';info.textContent='Не удалось войти: '+e2.message;return;}
    closeModal();
    startOnlineGame(room.code,'b',room.fen,room.time_control);
  };
  p.querySelector('#btnJoinRoom').onclick=async()=>{
    const code=(p.querySelector('#joinCode').value||'').trim().toUpperCase();
    if(!code){info.style.color='#e06a6a';info.textContent='Введите код';return;}
    info.style.color='#ffd84d';info.textContent='Подключение…';
    const {data:room,error}=await supabase.from('rooms').select('*').eq('code',code).maybeSingle();
    if(error){info.style.color='#e06a6a';info.textContent='Ошибка: '+error.message;return;}
    if(!room){info.style.color='#e06a6a';info.textContent='Комната не найдена';return;}
    if(room.host_id===currentUser.id){info.style.color='#ffd84d';info.textContent='Это ваша комната — ждите соперника';return;}
    if(room.status!=='waiting'){info.style.color='#e06a6a';info.textContent='Комната уже занята';return;}
    const {error:e2}=await supabase.from('rooms').update({guest_id:currentUser.id,status:'playing',draw_offer_by:null})
      .eq('code',code).eq('status','waiting');
    if(e2){info.style.color='#e06a6a';info.textContent='Не удалось войти: '+e2.message;return;}
    closeModal();
    startOnlineGame(code,'b',room.fen,room.time_control);
  };
}

/* ---------- Online game ---------- */
function startOnlineGame(code,color,fen,timeLimit){
  stopDemo();
  clearQualityBadge();clearHints();
  roomCode=code;orientation=color;buildSquares();
  const t=Math.max(10,Number(timeLimit)||600)*1000;
  G={mode:'online',st:parseFEN(fen||START_FEN),human:color,over:false,finished:false,
     history:[],quality:{'!!':0,'★':0,'!':0,'':0,'?':0,'??':0},resultText:'',
     wTime:t,bTime:t,lastMoveTime:Date.now(),drawModalOpen:false,drawOfferBy:null,
     oppName:'',clockDead:false,onlineFinished:false};
  selected=null;legalCache=[];
  drawBoard(G.st);updateMoveList();updateGameUI();
  subscribeOnlineRoom(code);
  if(clockTimer)clearInterval(clockTimer);
  clockTimer=setInterval(updateClocks,200);
  updateClocks();
  statusText(G.st.turn===color?'Ваш ход':'Ход соперника…');
}
function subscribeOnlineRoom(code){
  if(!supabase)return;
  if(onlineChannel){try{supabase.removeChannel(onlineChannel);}catch(e){}onlineChannel=null;}
  onlineChannel=supabase.channel('play-'+code).on('postgres_changes',
    {event:'UPDATE',schema:'public',table:'rooms',filter:`code=eq.${code}`},pl=>{
      handleRoomUpdate(pl.new);
    }).subscribe();
}
function handleRoomUpdate(room){
  if(!room||!G||G.mode!=='online')return;
  if(room.status==='finished'){
    if(room.fen&&room.fen!==stToFen(G.st)&&!G.over)applyRemoteFen(room.fen);
    if(!G.over){
      if(room.draw_offer_by)finishGame('draw','Соглашение');
      else finishGame('win','Соперник сдался');
    }
    return;
  }
  if(room.white_time!=null)G.wTime=Math.max(0,Number(room.white_time)||0);
  if(room.black_time!=null)G.bTime=Math.max(0,Number(room.black_time)||0);
  G.lastMoveTime=Date.now();
  if(room.draw_offer_by&&currentUser&&room.draw_offer_by!==currentUser.id&&!G.over&&!G.drawModalOpen){
    G.drawModalOpen=true;G.drawOfferBy=room.draw_offer_by;
    showModal('Ничья?','Соперник предлагает ничью.',[
      {label:'Принять',primary:true,onClick:()=>{closeModal();G.drawModalOpen=false;G.drawAccepted=true;finishGame('draw','Соглашение');}},
      {label:'Отклонить',onClick:()=>{
        G.drawModalOpen=false;
        if(supabase)supabase.from('rooms').update({draw_offer_by:null}).eq('code',roomCode).then(()=>{});
        closeModal();
      }}
    ]);
  }
  if(room.fen&&room.fen!==stToFen(G.st)&&!G.over)applyRemoteFen(room.fen);
}
function applyRemoteFen(fen){
  if(!G||G.over)return;
  const prev=G.st;
  let found=null;
  try{
    for(const m of legalMoves(prev)){
      if(stToFen(makeMove(prev,m))===fen){found=m;break;}
    }
  }catch(e){}
  if(found){applyMove(found,{remote:true});}
  else{
    try{G.st=parseFEN(fen);G.st.last=null;drawBoard(G.st);updateMoveList();checkGameEnd();}catch(e){}
  }
}
function settleClock(){
  if(!G)return;
  const dt=Math.max(0,Date.now()-(G.lastMoveTime||Date.now()));
  if(G.st.turn==='w')G.bTime=Math.max(0,(G.bTime||0)-dt);
  else G.wTime=Math.max(0,(G.wTime||0)-dt);
  G.lastMoveTime=Date.now();
}
function onlineAfterMove(){
  settleClock();
  if(!supabase||!roomCode||!currentUser)return;
  supabase.from('rooms').update({
    fen:stToFen(G.st),white_time:Math.round(G.wTime||0),black_time:Math.round(G.bTime||0),draw_offer_by:null
  }).eq('code',roomCode).then(()=>{});
}
function formatClock(ms){
  ms=Math.max(0,Number(ms)||0);
  const total=Math.floor(ms/1000),m=Math.floor(total/60),s=total%60;
  return m+':'+(s<10?'0':'')+s;
}
function updateClocks(){
  if(!G||G.mode!=='online')return;
  const el=$('#clockLine');if(!el)return;el.classList.add('on');
  const dt=G.over?0:Math.max(0,Date.now()-(G.lastMoveTime||Date.now()));
  let w=Math.max(0,G.wTime||0),b=Math.max(0,G.bTime||0);
  if(!G.over){if(G.st.turn==='w')w=Math.max(0,w-dt);else b=Math.max(0,b-dt);}
  const wEl=$('#clkW'),bEl=$('#clkB');
  if(wEl){wEl.textContent='⚪ '+formatClock(w);wEl.classList.toggle('active',!G.over&&G.st.turn==='w');wEl.classList.toggle('low',w<20000);}
  if(bEl){bEl.textContent='⚫ '+formatClock(b);bEl.classList.toggle('active',!G.over&&G.st.turn==='b');bEl.classList.toggle('low',b<20000);}
  if(!G.over&&!G.clockDead&&(w<=0||b<=0)){
    G.clockDead=true;
    const loserColor=G.st.turn;
    finishGame(loserColor===G.human?'lose':'win','Время');
  }
}
function offerDraw(){
  if(!supabase||!roomCode||!currentUser)return;
  G.drawOfferBy=currentUser.id;
  supabase.from('rooms').update({draw_offer_by:currentUser.id}).eq('code',roomCode).then(()=>{});
  toast('Предложение ничьей отправлено');
}
function sendOnlineFinish(){
  if(!supabase||!roomCode)return;
  const payload={status:'finished',fen:stToFen(G.st)};
  if(G.result==='draw')payload.draw_offer_by=G.drawOfferBy||(currentUser&&currentUser.id)||'draw';
  else payload.draw_offer_by=null;
  supabase.from('rooms').update(payload).eq('code',roomCode).then(()=>{});
}
function cleanupOnline(){
  if(clockTimer){clearInterval(clockTimer);clockTimer=null;}
  if(onlineChannel&&supabase){try{supabase.removeChannel(onlineChannel);}catch(e){}onlineChannel=null;}
  roomCode=null;
}
function finishOnlineGame(result,reason){
  if(!G||G.onlineFinished)return;
  G.onlineFinished=true;
  if(clockTimer){clearInterval(clockTimer);clockTimer=null;}
  updateClocks();
  const before=Number(S.rating)||1000;
  let delta=result==='win'?20:result==='lose'?-16:2;
  if(isPremium()){
    if(delta>0) delta=Math.round(delta*1.5);
    else if(delta<0) delta=-Math.round(Math.abs(delta)/1.25);
  }
  S.rating=Math.max(100,Math.round(before+delta));
  S.stats.gamesPlayed=(S.stats.gamesPlayed||0)+1;
  if(result==='win'){S.stats.wins=(S.stats.wins||0)+1;if(reason==='Мат')S.stats.matesDelivered=(S.stats.matesDelivered||0)+1;}
  else if(result==='lose')S.stats.losses=(S.stats.losses||0)+1;
  else S.stats.draws=(S.stats.draws||0)+1;
  const stars=result==='win'?60:result==='draw'?25:10;
  S.stars=(S.stars||0)+stars;
  S.stats.starsEarned=(S.stats.starsEarned||0)+stars;
  const xp=result==='win'?30:result==='draw'?15:8;
  gainXp(xp);
  save();checkAchievements();
  sendOnlineFinish();
  const title=result==='win'?t('win'):result==='lose'?t('lose'):t('draw');
  showModal(title,
    `<div style="font-size:14px;font-weight:700;margin-bottom:6px">${esc(G.resultText||'')}</div>
     <div style="color:var(--muted);line-height:1.9">
       Соперник: <b>${esc(G.oppName||'игрок')}</b><br>
       Рейтинг: <b>${before}</b> → <b style="color:${delta>=0?'var(--accent)':'#e06a6a'}">${S.rating}</b><br>
       Звёзды: <b style="color:var(--accent)">+${stars}</b><br>
       Опыт: <b style="color:var(--accent)">+${xp} XP</b>
     </div>`,
    [
      {label:'В лобби',primary:true,onClick:()=>{closeModal();openLobby();}},
      {label:'В меню',onClick:()=>{closeModal();stopDemo();startDemo();}}
    ]);
  cleanupOnline();
}
window.addEventListener('beforeunload',()=>{
  if(!supabase||!roomCode)return;
  try{supabase.from('rooms').update({status:'finished'}).eq('code',roomCode).then(()=>{});}catch(e){}
});

/* ---------- Leaderboard ---------- */
function openLeaderboard(){
  if(!supabase){toast('Онлайн недоступен');return;}
  const p=showModal('Таблица лидеров','<div id="lbContent" style="text-align:center;padding:20px">Загрузка…</div>',[],true);
  const renderList=async crit=>{
    const box=p.querySelector('#lbContent');
    box.innerHTML='<div style="text-align:center;padding:20px">Загрузка…</div>';
    const col=crit==='stars'?'stars':crit==='xp'?'xp':'rating';
    const {data,error}=await supabase.from('profiles')
      .select('username,rating,stars,xp')
      .order(col,{ascending:false}).limit(20);
    if(error){box.textContent='Ошибка: '+error.message;return;}
    if(!data||!data.length){box.innerHTML='<div style="text-align:center;color:var(--muted);padding:20px">Пока пусто</div>';return;}
    let html='<div style="display:flex;flex-direction:column;gap:8px">';
    data.forEach((user,i)=>{
      const name=String(user.username||'Игрок');
      let hash=0;for(let j=0;j<name.length;j++)hash=name.charCodeAt(j)+((hash<<5)-hash);
      const hue=Math.abs(hash)%360;
      const val=col==='stars'?(user.stars||0):col==='xp'?(user.xp||0):(user.rating||0);
      const rankColor=i===0?'#ffd700':i===1?'#c0c0c0':i===2?'#cd7f32':'var(--muted)';
      html+=`<div style="display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--panel2);border-radius:8px">
        <div style="font-size:14px;font-weight:bold;width:28px;color:${rankColor}">#${i+1}</div>
        <div class="avatar" style="width:32px;height:32px;font-size:14px;background:hsl(${hue},60%,45%)">${esc(name[0]||'?').toUpperCase()}</div>
        <div style="flex:1;font-weight:bold;color:#fff;overflow:hidden;text-overflow:ellipsis">${esc(name)}</div>
        <div style="color:var(--accent);font-weight:bold">${fmt(val)}</div>
      </div>`;
    });
    html+='</div>';
    box.innerHTML=html;
  };
  p.querySelector('.modal-body').innerHTML=`
    <div class="tabs">
      <button class="tab on" data-crit="rating">Рейтинг</button>
      <button class="tab" data-crit="stars">Звёзды</button>
      <button class="tab" data-crit="xp">Опыт</button>
    </div>
    <div id="lbContent"></div>`;
  p.querySelectorAll('[data-crit]').forEach(b=>b.onclick=()=>{
    p.querySelectorAll('[data-crit]').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');renderList(b.dataset.crit);
  });
  renderList('rating');
}

/* ---------- Moderation ---------- */
async function openModPanel(){
  if(!supabase){toast('Онлайн недоступен');return;}
  if(!S.is_mod){toast('Нет прав');return;}
  const p=showModal('Панель модератора','<div id="modContent" style="text-align:center;padding:20px">Загрузка…</div>',[],true);
  const box=p.querySelector('#modContent');
  const renderMod=async()=>{
    box.innerHTML='<div style="text-align:center;padding:20px">Загрузка…</div>';
    let html='<h4>Заявки на аватары</h4>';
    const {data:profiles,error}=await supabase.from('profiles').select('*').not('pending_avatar','is',null);
    if(error){box.textContent='Ошибка: '+error.message;return;}
    if(!profiles||!profiles.length)html+='<div style="color:var(--muted);margin-bottom:20px">Нет заявок</div>';
    else profiles.forEach(u=>{
      const img=safeImgUrl(u.pending_avatar);
      html+=`<div class="listRow" style="flex-wrap:wrap;gap:10px">
        <div class="avatar" style="width:50px;height:50px">${img?`<img src="${esc(img)}" alt="">`:'?'}</div>
        <div style="flex:1;font-weight:bold">${esc(u.username||'Игрок')}</div>
        <button class="btn primary" data-approve="${esc(u.id)}">Принять</button>
        <button class="btn" style="color:#e06a6a" data-reject="${esc(u.id)}">Отклонить</button>
      </div>`;
    });
    const {data:banned,error:be}=await supabase.from('profiles').select('*').eq('is_banned',true);
    html+='<h4 style="margin-top:20px">Заблокированные</h4>';
    if(be||!banned||!banned.length)html+='<div style="color:var(--muted)">Никого</div>';
    else banned.forEach(u=>{
      html+=`<div class="listRow"><div style="flex:1;font-weight:bold;color:#e06a6a">${esc(u.username||'Игрок')}</div>
        <button class="btn" data-unban="${esc(u.id)}">Разблокировать</button></div>`;
    });
    html+='<h4 style="margin-top:20px">Управление по нику</h4>'
      +'<input type="text" id="modNickInput" class="authInput" placeholder="Ник игрока" maxlength="16">'
      +'<div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap">'
      +'<button class="btn primary" data-grant="mod" style="flex:1">+ Модерка</button>'
      +'<button class="btn primary" data-grant="premium" style="flex:1">+ Premium</button>'
      +'<button class="btn" data-revoke="mod" style="flex:1">− Модерка</button>'
      +'<button class="btn" data-revoke="premium" style="flex:1">− Premium</button>'
      +'</div>'
      +'<div style="font-size:11px;color:var(--muted);margin-top:8px">Если ники совпадают по регистру, используйте точное написание.</div>';
    html+='<h4 style="margin-top:20px">Все игроки</h4>';
    const {data:all}=await supabase.from('profiles').select('id,username,is_banned').limit(50);
    (all||[]).forEach(u=>{
      if(u.is_banned)return;
      html+=`<div class="listRow"><div style="flex:1">${esc(u.username||'Игрок')}</div>
        <button class="btn" style="color:#e06a6a" data-ban="${esc(u.id)}">Забанить</button></div>`;
    });
    box.innerHTML=html;
    const act=(sel,fn)=>box.querySelectorAll(sel).forEach(b=>b.onclick=fn(b));
    act('[data-approve]',b=>async()=>{
      const prof=(profiles||[]).find(x=>String(x.id)===b.dataset.approve);
      if(!prof)return;
      await supabase.from('profiles').update({avatar_url:safeImgUrl(prof.pending_avatar),pending_avatar:null}).eq('id',prof.id);
      toast('Аватар принят');renderMod();
    });
    act('[data-reject]',b=>async()=>{
      await supabase.from('profiles').update({pending_avatar:null}).eq('id',b.dataset.reject);
      toast('Заявка отклонена');renderMod();
    });
    act('[data-ban]',b=>async()=>{
      await supabase.from('profiles').update({is_banned:true}).eq('id',b.dataset.ban);
      toast('Забанен');renderMod();
    });
    act('[data-unban]',b=>async()=>{
      await supabase.from('profiles').update({is_banned:false}).eq('id',b.dataset.unban);
      toast('Разблокирован');renderMod();
    });
    const doGrant=async(field,val)=>{
      const inp=box.querySelector('#modNickInput');
      const nick=(inp&&inp.value||'').trim();
      if(!nick){toast('Введите ник');return;}
      const {data:found,error}=await supabase.from('profiles').select('id,username').ilike('username',nick).maybeSingle();
      if(error||!found){toast('Игрок с таким ником не найден');return;}
      const upd={}; upd[field]=val;
      const {error:e2}=await supabase.from('profiles').update(upd).eq('id',found.id);
      if(e2){toast('Ошибка: '+e2.message);return;}
      toast((field==='is_mod'?'Модерка':'Premium')+' '+(val?'выдан':'снят')+': '+found.username);
      renderMod();
    };
    box.querySelectorAll('[data-grant]').forEach(b=>b.onclick=()=>{
      const tg=b.dataset.grant;
      doGrant(tg==='mod'?'is_mod':'is_premium',true);
    });
    box.querySelectorAll('[data-revoke]').forEach(b=>b.onclick=()=>{
      const tg=b.dataset.revoke;
      doGrant(tg==='mod'?'is_mod':'is_premium',false);
    });
  };
  renderMod();
}
