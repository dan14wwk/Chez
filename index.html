<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0e1116">
<title>Chez! v1.0 Release</title>
<style>
:root{
  --bg:#0e1116; --panel:#161a21; --panel2:#1e242e; --fg:#e9ecf2; --muted:#8b93a3;
  --accent:#7cd4a3; --accent-fg:#08120c;
  --sq-light:#e9e4d9; --sq-dark:#7d8b96;
  --pw:#ffffff; --pb:#1b1f27;
  --board:350px; --radius:12px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
body[data-theme="light"]{--bg:#f2f4f8;--panel:#ffffff;--panel2:#eaeef4;--fg:#131820;--muted:#5b6573;}
body[data-theme="contrast"]{--bg:#000;--panel:#0b0b0b;--panel2:#181818;--fg:#fff;--muted:#9a9a9a;--accent:#ffd400;--accent-fg:#000;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:#05070a}
body{font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;color:var(--fg);user-select:none;display:grid;place-items:center; padding-top:var(--safe-top); padding-bottom:var(--safe-bottom)}
#stage{position:relative;width:900px;height:600px;transform-origin:center;background:var(--bg);
  overflow:hidden;color:var(--fg);box-shadow:0 0 0 1px rgba(255,255,255,.05);contain:strict}
#app{position:absolute;inset:0;display:flex;gap:12px;padding:12px;align-items:flex-start;justify-content:center;overflow:hidden}
#side{width:var(--board);flex:0 0 auto;display:flex;flex-direction:column;gap:6px}
#title{margin:0;font-size:22px;letter-spacing:.5px;font-weight:800;
  background:linear-gradient(90deg,var(--accent),var(--fg));-webkit-background-clip:text;background-clip:text;color:transparent}
#logoWrap{width:100%;aspect-ratio:1/1;background:var(--panel);border-radius:var(--radius);overflow:hidden;
  display:grid;place-items:center;border:1px solid rgba(255,255,255,.07)}
#logo{width:100%;height:100%;object-fit:contain;display:block}
#menu{display:flex;flex-direction:column;gap:8px}
.mbtn{display:flex;align-items:center;gap:9px;width:100%;padding:10px 14px;border-radius:10px;
  border:1px solid rgba(255,255,255,.08);background:var(--panel);color:var(--fg);font-size:13px;font-weight:650;
  cursor:pointer;transition:transform .12s,background .2s,border-color .2s;font-family:inherit}
.mbtn:active{transform:scale(.97)}
.mbtn .ico{width:18px;height:18px;display:grid;place-items:center;opacity:.9;flex:0 0 auto}
.mbtn svg{width:16px;height:16px;fill:currentColor}
#main{flex:0 0 auto;display:flex;flex-direction:column;gap:6px;align-items:stretch}
#topbar{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--muted)}
#ver{letter-spacing:.3px}
.wnwrap{position:relative}
#wnBtn{background:transparent;border:1px solid rgba(255,255,255,.12);color:var(--muted);border-radius:7px;
  padding:4px 10px;font-size:11px;cursor:pointer;font-family:inherit;transition:.2s}
#playArea{display:flex;align-items:flex-start;overflow:hidden}
#boardCol{display:flex;flex-direction:column;gap:4px;align-items:center}
.capRow{width:var(--board);min-height:20px;display:flex;flex-wrap:wrap;gap:2px;align-items:center;
  padding:1px 4px;border-radius:6px;background:rgba(127,127,127,.07);font-size:15px;line-height:1;color:var(--muted)}
#board{width:var(--board);height:var(--board);position:relative;border-radius:8px;overflow:hidden;
  box-shadow:0 12px 38px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.06);touch-action:none}
#squares{position:absolute;inset:0;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);z-index:0}
.sq{position:relative}
.sq.light{background:var(--sq-light)}
.sq.dark{background:var(--sq-dark)}
.sq .coord{position:absolute;font-size:max(7px,calc(var(--board)/44));font-weight:700;line-height:1;pointer-events:none;opacity:.7}
.sq .coord.file{right:5%;bottom:2%}
.sq .coord.rank{left:5%;top:2%}
.sq.light .coord{color:var(--sq-dark)}
.sq.dark .coord{color:var(--sq-light)}
.sq.sel::after{content:'';position:absolute;inset:0;box-shadow:inset 0 0 0 3px var(--accent);border-radius:2px;pointer-events:none}
.sq.check::after{content:'';position:absolute;inset:0;background:radial-gradient(circle,rgba(255,60,60,.85),transparent 72%);pointer-events:none}
.sq.lastmv::after{content:'';position:absolute;inset:0;background:rgba(124,212,163,.22);pointer-events:none}
.sq.hint-from::before,.sq.hint-to::before{content:'';position:absolute;inset:0;pointer-events:none;border-radius:2px;
  background:rgba(255,77,77,.12);box-shadow:inset 0 0 0 3px rgba(255,77,77,.5),inset 0 0 16px rgba(255,77,77,.3);animation:hintPulse 1.6s ease-in-out infinite}
@keyframes hintPulse{0%,100%{box-shadow:inset 0 0 0 3px rgba(255,77,77,.5),inset 0 0 16px rgba(255,77,77,.3)}50%{box-shadow:inset 0 0 0 3px rgba(255,77,77,.85),inset 0 0 26px rgba(255,77,77,.55)}}
#pieces{position:absolute;inset:0;pointer-events:none;z-index:10}
.piece{position:absolute;left:0;top:0;width:12.5%;height:12.5%;display:flex;align-items:center;justify-content:center;
  will-change:transform; transition:transform .22s cubic-bezier(.25,1,.35,1); padding: 3%;}
.piece svg { width: 100%; height: 100%; fill: currentColor; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.5)); }
.piece.w{color:var(--pw);}
.piece.b{color:var(--pb);}
.piece.drag{transition:none;z-index:30;transform:scale(1.15) !important;filter:drop-shadow(0 10px 14px rgba(0,0,0,.55))}
.piece.gone{opacity:0;transform:scale(.4)!important;transition:opacity .18s,transform .18s}
.noanim .piece{transition:none!important}
#arrows{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5;overflow:visible}
#statusLine{font-size:12px;color:var(--muted);text-align:center;min-height:18px;width:100%}
#gameBar{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;width:100%}
.sbtn{background:var(--panel);border:1px solid rgba(255,255,255,.09);color:var(--fg);border-radius:8px;
  padding:8px 12px;font-size:12px;cursor:pointer;font-family:inherit;transition:.2s}
#modalRoot{position:absolute;inset:0;pointer-events:none;z-index:100}
.modal-back{position:absolute;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(6px);
  display:grid;place-items:center;pointer-events:auto;animation:fade .18s ease;padding:16px;overflow:hidden}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{width:100%;max-width:480px;max-height:85vh;display:flex;flex-direction:column;background:var(--panel);
  border:1px solid rgba(255,255,255,.1);border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.6);
  animation:up .2s cubic-bezier(.2,.9,.3,1);overflow:hidden}
@keyframes up{from{transform:translateY(20px) scale(.95);opacity:0}to{transform:none;opacity:1}}
.modal.wide{max-width:760px}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.07);flex:0 0 auto}
.modal-head h3{margin:0;font-size:16px;font-weight:750}
.xbtn{background:transparent;border:0;color:var(--muted);font-size:18px;cursor:pointer;padding:4px 8px;border-radius:7px}
.modal-body{padding:14px 16px;overflow-y:auto;font-size:13px;line-height:1.6;flex:1 1 auto;min-height:0; -webkit-overflow-scrolling: touch;}
.modal-foot{padding:12px 16px;display:flex;gap:8px;justify-content:flex-end;border-top:1px solid rgba(255,255,255,.07);flex-wrap:wrap;flex:0 0 auto}
.btn{background:var(--panel2);border:1px solid rgba(255,255,255,.1);color:var(--fg);border-radius:9px;
  padding:10px 16px;font-size:13px;cursor:pointer;font-family:inherit;transition:.2s;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.listRow{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:11px;background:var(--panel2);
  border:1px solid transparent;margin-bottom:8px;cursor:pointer;transition:.18s}
.listRow .nm{flex:1;font-weight:650}
.listRow .sub{font-size:11px;color:var(--muted);font-weight:400}
.badge{font-size:11px;padding:4px 10px;border-radius:99px;background:rgba(124,212,163,.15);color:var(--accent);font-weight:700}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tab{padding:8px 14px;border-radius:8px;background:var(--panel2);border:1px solid transparent;cursor:pointer;
  font-size:12px;font-family:inherit;color:var(--muted);transition:.2s;font-weight:600}
.tab.on{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.card{background:var(--panel2);border:1px solid rgba(255,255,255,.07);border-radius:11px;padding:10px;text-align:center;transition:.18s;position:relative}
.card .prev{height:52px;border-radius:7px;display:grid;place-items:center;margin-bottom:6px;font-size:22px;overflow:hidden;position:relative}
.card .nm{font-size:12px;font-weight:650;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .pr{font-size:11px;color:var(--muted);margin-bottom:6px}
.card .btn{width:100%;padding:6px;font-size:12px;border-radius:7px}
.setRow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;
  border-bottom:1px solid rgba(255,255,255,.05);font-size:13px}
.setRow:last-child{border-bottom:0}
.switch{width:46px;height:26px;border-radius:99px;background:var(--panel2);border:1px solid rgba(255,255,255,.12);
  position:relative;cursor:pointer;transition:.2s;flex:0 0 auto}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;
  background:var(--muted);transition:.2s}
.switch.on{background:var(--accent);border-color:transparent}
.switch.on::after{left:24px;background:var(--accent-fg)}
select,input[type=color]{background:var(--panel2);border:1px solid rgba(255,255,255,.12);color:var(--fg);
  border-radius:7px;padding:8px 10px;font-family:inherit;font-size:12px;cursor:pointer}
input[type=color]{padding:2px;height:32px;width:48px}
.toast{position:absolute;left:50%;bottom:30px;transform:translate(-50%,20px);background:var(--panel);
  border:1px solid var(--accent);color:var(--fg);padding:10px 18px;border-radius:11px;font-size:13px;
  z-index:300;opacity:0;transition:.25s;box-shadow:0 12px 32px rgba(0,0,0,.5);pointer-events:none;max-width:90%}
.toast.show{opacity:1;transform:translate(-50%,0)}
.more-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:6px 0}
.more-item{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:20px 8px;background:var(--panel2);border:1px solid rgba(255,255,255,.07);border-radius:12px;
  cursor:pointer;transition:.18s;min-height:85px}
.more-item svg{width:28px;height:28px;fill:var(--accent);transition:.18s}
.more-item .lbl{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:10px;
  color:var(--muted);transition:.18s;font-weight:600}
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;overflow:hidden;
  background:var(--panel2);font-size:22px;font-weight:800;flex:0 0 auto;border:1px solid rgba(255,255,255,.12)}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.frame-bronze{box-shadow:0 0 0 3px #cd7f32,0 0 12px rgba(205,127,50,.55)}
.frame-silver{box-shadow:0 0 0 3px #c0c0c0,0 0 12px rgba(192,192,192,.55)}
.frame-gold{box-shadow:0 0 0 3px #ffd700,0 0 12px rgba(255,215,0,.55)}
.frame-neon{box-shadow:0 0 0 3px #00e5c0,0 0 14px rgba(0,229,192,.6)}
.frame-emerald{box-shadow:0 0 0 3px #2ecc71,0 0 14px rgba(46,204,113,.6)}
.frame-ruby{box-shadow:0 0 0 3px #e74c3c,0 0 14px rgba(231,76,60,.6)}
.frame-sapphire{box-shadow:0 0 0 3px #3498db,0 0 14px rgba(52,152,219,.6)}
.frame-amethyst{box-shadow:0 0 0 3px #9b59b6,0 0 14px rgba(155,89,182,.6)}
.frame-fire{box-shadow:0 0 0 3px #ff6b00,0 0 14px rgba(255,107,0,.6)}
.frame-ice{box-shadow:0 0 0 3px #74ebd5,0 0 14px rgba(116,235,213,.6)}
.frame-toxic{box-shadow:0 0 0 3px #aaff00,0 0 14px rgba(170,255,0,.6)}
.frame-cosmic{box-shadow:0 0 0 3px #00e5c0,0 0 16px rgba(0,229,192,.65),inset 0 0 8px rgba(160,107,255,.4)}
.frame-blood{box-shadow:0 0 0 3px #8b0000,0 0 14px rgba(139,0,0,.7)}
.frame-rainbow{animation:hue 4s linear infinite;box-shadow:0 0 0 3px #ff00ff,0 0 18px rgba(255,0,255,.6)}
.frame-diamond{box-shadow:0 0 0 3px #e0f7ff,0 0 18px rgba(224,247,255,.7),inset 0 0 8px rgba(255,255,255,.5)}
.frame-shadow{box-shadow:0 0 0 3px #2c2c2c,0 0 18px rgba(0,0,0,.9),inset 0 0 8px rgba(255,255,255,.1)}
.frame-holy{box-shadow:0 0 0 3px #fff4c2,0 0 20px rgba(255,244,194,.7)}
.frame-void{box-shadow:0 0 0 3px #1a1a2e,0 0 18px rgba(160,107,255,.6)}
.frame-legend{box-shadow:0 0 0 3px #ff00ff,0 0 18px rgba(255,0,255,.6)}
.frame-premium{box-shadow:0 0 0 3px #ffd700,0 0 20px rgba(255,215,0,.7);animation:hue 6s linear infinite}
@keyframes hue{to{filter:hue-rotate(360deg)}}
.name-premium{background:linear-gradient(90deg,#ffd700,#ff00ff,#00e5c0,#ffd700);background-size:200% auto;
  -webkit-background-clip:text;background-clip:text;color:transparent!important;
  animation:premiumShine 4s linear infinite;font-weight:800}
@keyframes premiumShine{to{background-position:200% center}}

/* Mobile optimizations */
@media (max-width: 768px) {
  #stage { width: 100vw; height: 100vh; transform: none !important; }
  #app { flex-direction: column; padding: 8px; gap: 8px; justify-content: flex-start; }
  #main { width: 100%; height: 100%; flex: 1; display: flex; flex-direction: column; }
  #side { display: none; } /* Скрываем левое меню, используем мобильную навигацию */
  #playArea { justify-content: center; width: 100%; margin-top: 10px; }
  :root { --board: calc(100vw - 20px); }
  #boardCol { width: var(--board); }
  .capRow { display: none; }
  #topbar { width: 100%; padding: 0 5px; }
  .mbtn { padding: 12px 16px; font-size: 14px; }
  
  /* Мобильная панель снизу */
  .mobile-nav { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; width: 100%; padding: 8px 0; }
  .mobile-nav .mbtn { flex-direction: column; gap: 4px; padding: 8px 4px; font-size: 10px; text-align: center; }
  .mobile-nav .mbtn svg { width: 20px; height: 20px; }
  
  .modal { max-height: 90vh; width: 95%; }
  .modal-head { padding: 12px; }
  .modal-body { padding: 12px; }
  .grid { grid-template-columns: repeat(2, 1fr); }
  .more-grid { grid-template-columns: repeat(3, 1fr); }
}
</style>
</head>
<body data-theme="dark">
<div id="stage" data-orient="landscape">
  <div id="app">
    <!-- Desktop Sidebar -->
    <aside id="side">
      <h1 id="title">Chez!</h1>
      <div id="logoWrap">
        <div id="logo" style="display:grid;place-items:center;font-size:54px;color:var(--accent);text-shadow:0 0 24px rgba(124,212,163,.35)">♞</div>
      </div>
      <nav id="menu">
        <button class="mbtn" data-act="play"><span class="ico">▶</span><span>Играть</span></button>
        <button class="mbtn" data-act="learn"><span class="ico">📖</span><span>Учиться</span></button>
        <button class="mbtn" data-act="more"><span class="ico">☰</span><span>Ещё</span></button>
        <button class="mbtn" data-act="account" id="btnAccount"><span class="ico">👤</span><span id="accountName">Аккаунт</span></button>
      </nav>
    </aside>

    <main id="main">
      <div id="topbar">
        <span id="ver">v1.0 Release</span>
        <button id="wnBtn">что нового</button>
      </div>

      <div id="playArea">
        <div id="boardCol">
          <div id="capTop" class="capRow"></div>
          <div id="board">
            <div id="squares"></div>
            <div id="pieces"></div>
            <svg id="arrows" viewBox="0 0 800 800" preserveAspectRatio="none"></svg>
          </div>
          <div id="capBot" class="capRow"></div>
        </div>
      </div>

      <div id="statusLine"></div>
      <div id="clockLine" style="display:none"><span class="clk" id="clkW">⚪ 10:00</span><span class="clk" id="clkB">⚫ 10:00</span></div>
      <div id="gameBar"></div>
      <div id="trainerBox"></div>

      <!-- Mobile Nav -->
      <div class="mobile-nav" style="display:none">
        <button class="mbtn" data-act="play"><span>▶</span>Играть</button>
        <button class="mbtn" data-act="learn"><span>📖</span>Учиться</button>
        <button class="mbtn" data-act="more"><span>☰</span>Ещё</button>
        <button class="mbtn" data-act="account"><span>👤</span>Аккаунт</button>
      </div>
    </main>
  </div>
  <div id="modalRoot"></div>
</div>

<script>
(function(){
'use strict';
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>Array.from(r.querySelectorAll(s));
const stage = document.getElementById('stage');
const SVGNS = 'http://www.w3.org/2000/svg';
function div(c){const d=document.createElement('div'); if(c)d.className=c; return d;}
function fmt(n){return Math.round(n).toLocaleString('ru-RU');}
function clamp(v,a,b){return v<a?a:v>b?b:v;}

// 10 Текстурпаков для фигур
const PIECE_TEXTURES = {
  1: { name: 'Классика', p: `<path d="M12 2a3 3 0 0 0-3 3c0 1.3.8 2.4 2 2.8V9H9v2h2v3l-2 2h6l-2-2v-3h2V9h-2V7.8c1.2-.4 2-1.5 2-2.8a3 3 0 0 0-3-3z"/>`, n: `<path d="M10 2a2 2 0 0 0-2 2v3L5 9v2l2-1v3l-2 4v3h12v-3l-3-6V6l1-1v3h2V4l-3 1-1-2h-3z"/>`, b: `<path d="M12 2a2 2 0 0 0-2 2c0 .7.4 1.4 1 1.7V7H9v2h2v3l-2 4h6l-2-4v-3h2V7h-2V5.7c.6-.3 1-1 1-1.7a2 2 0 0 0-2-2z"/>`, r: `<path d="M5 3v3h2v2H5v12h14V8h-2V6h2V3h-3v3h-2V3h-4v3H7V3H5z"/>`, q: `<path d="M12 1l-2 3h4l-2-3zm-5 4a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm10 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zM7 9v3l-2 8h14l-2-8V9c-1.5 2-3 2-5 2s-3.5 0-5-2z"/>`, k: `<path d="M12 1v4H8v2h4v2h-2a4 4 0 0 0-4 4c0 2 1.5 3.5 3 4l-1 4h8l-1-4c1.5-.5 3-2 3-4a4 4 0 0 0-4-4h-2V7h4V5h-4V1h-2z"/>` },

let nodes=0,NODE_LIMIT=140000;
function evaluate(st){let s=0;for(let i=0;i<64;i++){const p=st.b[i];if(!p)continue;const white=p.k<'a',t=p.k.toLowerCase();let v=VAL[t];const f=i%8,r=(i/8)|0,c=3.5-Math.max(Math.abs(f-3.5),Math.abs(r-3.5));if(t==='n'||t==='b')v+=c*7;else if(t==='p')v+=c*5;else if(t==='k')v-=c*5;s+=white?v:-v;}return s;}

  stars:0,crowns:0,unlocked:1, texture:1,

  settings:{theme:'dark', sound:true, animations:true, showCaptured:true, showMoves:true, showQuality:true, pieceColorW:'#ffffff', pieceColorB:'#1b1f27'},
  lessons:{basics:[],debuts:[],mates:[]},
  stats:{gamesPlayed:0,wins:0,losses:0,draws:0,moves:{'!!':0,'★':0,'!':0,'':0,'?':0,'??':0},captures:0,matesDelivered:0,castles:0,promotions:0,enPassant:0,botWins:[0,0,0,0,0]},
  xp:0, rating:1000,
  inventory:{avatars:['♟️'],frames:[''],prefixes:['']},
  avatar_url:null, is_mod:false, is_premium:false, username:'', nickColor:'#e9ecf2', seenWelcome:false
};

function migrateSave(){
  let s=null; try{const raw=localStorage.getItem(SAVE_KEY)||localStorage.getItem('chez_save_v10');if(raw)s=JSON.parse(raw);}catch(e){}
  const d=JSON.parse(JSON.stringify(DEFAULT_SAVE));
  if(!s) return d;
  return Object.assign(d, s, {settings:Object.assign(d.settings, s.settings||{}), inventory:Object.assign(d.inventory, s.inventory||{})});
}
let S=migrateSave();

function save(){
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(S));}catch(e){}
  if(isOnline && currentUser && supabase) {
    supabase.from('profiles').update({ settings: S.settings, equipped: S.equipped, avatar_url: S.avatar_url }).eq('id', currentUser.id);
  }
}

function isPremium(){ return !!(S && (S.is_premium || isMod)); }
function setAccountName(name){
  const el=document.getElementById('accountName'); if(!el) return;
  el.textContent=(S.equipped.prefix?S.equipped.prefix+' ':'')+(name||'Аккаунт');
  el.className = isPremium() ? 'name-premium' : '';
}

let AC=null; function ac(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC;}
function tone(freq,dur,type,vol){ if(!S.settings.sound) return; try{const c=ac(),o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.value=freq;o.connect(g);g.connect(c.destination);const tt=c.currentTime;g.gain.setValueAtTime(0.0001,tt);g.gain.linearRampToValueAtTime(vol||0.08,tt+0.012);g.gain.exponentialRampToValueAtTime(0.0001,tt+dur);o.start(tt);o.stop(tt+dur+0.03);}catch(e){} }
const SFX={ click:()=>tone(520,0.06,'square',0.05), move:()=>tone(380,0.09,'sine',0.09), capture:()=>{tone(240,0.13,'triangle',0.11);setTimeout(()=>tone(180,0.1,'triangle',0.08),40);}, win:()=>[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,0.17,'sine',0.1),i*110)), lose:()=>[420,330,250].forEach((f,i)=>setTimeout(()=>tone(f,0.22,'sine',0.1),i*140)), error:()=>tone(140,0.12,'sawtooth',0.05) };

// BOARD
const boardEl=$('#board'), squaresEl=$('#squares'), piecesEl=$('#pieces'), arrowsEl=$('#arrows');
let squares=[], orientation='w', pieceEls=new Map(), selected=null, legalCache=[];

function buildSquares(){
  squaresEl.innerHTML=''; squares=[];
  for(let v=0;v<64;v++){
    const d=div('sq'); const f=v%8,r=(v/8)|0;
    d.classList.add(((f+r)%2===0)?'light':'dark');
    const boardIdx = orientation==='w'?v:(7-(v/8|0))*8+(7-v%8);
    if(r===7){const sp=document.createElement('span');sp.className='coord file';sp.textContent='abcdefgh'[boardIdx%8];d.appendChild(sp);}
    if(f===0){const sp=document.createElement('span');sp.className='coord rank';sp.textContent=8-(boardIdx/8|0);d.appendChild(sp);}
    squares.push(d); squaresEl.appendChild(d);
  }
}
function boardToView(i){const f=i%8,r=(i/8)|0;return orientation==='w'?r*8+f:(7-r)*8+(7-f);}
function viewToBoard(v){const f=v%8,r=(v/8)|0;return orientation==='w'?r*8+f:(7-r)*8+(7-f);}
function posTransform(i){const v=boardToView(i),x=v%8,y=(v/8)|0;return `translate(${x*100}%,${y*100}%)`;}

function renderPieces(st){
  const tex = PIECE_TEXTURES[S.texture] || PIECE_TEXTURES[1];
  const seen=new Set();
  for(let i=0;i<64;i++){
    const p=st.b[i]; if(!p) continue;
    seen.add(p.id);
    let el=pieceEls.get(p.id);
    if(!el){el=div('piece');el.dataset.id=p.id;pieceEls.set(p.id,el);piecesEl.appendChild(el);}
    el.innerHTML = tex[p.k.toLowerCase()];
    el.className = `piece ${p.k<'a'?'w':'b'}`;
    el.style.transform=posTransform(i);
  }
  pieceEls.forEach((el,id)=>{if(!seen.has(id)){el.classList.add('gone');pieceEls.delete(id);setTimeout(()=>el.remove(),240);}});
}
function drawBoard(st){
  renderPieces(st);
  for(const s of squares) s.classList.remove('sel','check','lastmv');
  if(st.last){squares[boardToView(st.last.from)].classList.add('lastmv');squares[boardToView(st.last.to)].classList.add('lastmv');}
  if(selected!=null) squares[boardToView(selected)].classList.add('sel');
}

// GAME LOGIC
let G=null, botTimer=null;
function startOfflineGame(botIndex){
  if(botTimer)clearTimeout(botTimer);
  orientation=Math.random()<0.5?'w':'b'; buildSquares();
  const elos=[50,200,400,800,1000];
  G={mode:'offline', st:parseFEN('rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1'), human:orientation, botElo:elos[botIndex], over:false, history:[]};
  drawBoard(G.st); updateUI();
  if(G.st.turn!==G.human) scheduleBot();
}
function scheduleBot(){
  if(botTimer)clearTimeout(botTimer);
  botTimer=setTimeout(()=>{
    if(!G||G.over)return;
    const m=pickMove(G.st, G.botElo);
    if(m) applyMove(m, false);
    if(!G.over && G.st.turn!==G.human) scheduleBot();
  },300);
}
function applyMove(m, isHuman){
  const prev=cloneSt(G.st);
  G.st=makeMove(G.st,m);
  G.st.last={from:m.from,to:m.to};
  G.history.push({move:m, prev});
  drawBoard(G.st); updateUI(); SFX.move();
  
  const moves=legalMoves(G.st);
  if(!moves.length){
    G.over=true;
    const k=findKing(G.st.b,G.st.turn);
    const inChk=k>=0&&attacked(G.st.b,k,G.st.turn==='w'?'b':'w');
    finishGame(inChk?(G.st.turn===G.human?'lose':'win'):'draw', inChk?'Мат':'Пат');
    return;
  }
  if(!G.over && G.st.turn!==G.human && !isHuman) scheduleBot();
}
function finishGame(res, reason){
  let xp=res==='win'?30:10, stars=res==='win'?50:5;
  if(isOnline && supabase) {
    supabase.rpc('add_rewards', { p_xp: xp, p_stars: stars, p_win: res==='win', p_draw: res==='draw' }).then(({data})=>{
      if(data&&data.success){ S.xp=data.xp; S.stars=data.stars; setAccountName(S.username); }
    });
  } else {
    S.xp+=xp; S.stars+=stars; save();
  }
  showModal(res==='win'?'Победа!':'Игра окончена', `Результат: ${reason}`, [{label:'В меню',primary:true,onClick:()=>{closeModal(); location.reload();}}]);
}

// POINTER (Supports Touch & Mouse)
let ptr={down:false,sq:-1,dragEl:null,from:-1};
boardEl.addEventListener('pointerdown',e=>{
  if(!G||G.over||G.st.turn!==G.human) return;
  const r=boardEl.getBoundingClientRect();
  const x=e.clientX-r.left, y=e.clientY-r.top;
  const f=Math.floor(x/(r.width/8)), rk=Math.floor(y/(r.height/8));
  if(f<0||f>7||rk<0||rk>7) return;
  const sq=viewToBoard(rk*8+f);
  const p=G.st.b[sq];
  if(p && (p.k<'a'?'w':'b')===G.human){
    selected=sq; legalCache=legalMoves(G.st); drawBoard(G.st);
    const el=pieceEls.get(p.id); if(el){ptr.dragEl=el; ptr.from=sq;}
    ptr.down=true; ptr.sq=sq;
  } else if(selected!=null){
    const m=legalCache.find(mv=>mv.from===selected&&mv.to===sq);
    if(m){ applyMove(m, true); selected=null; legalCache=[]; }
    else { selected=null; drawBoard(G.st); }
  }
});
window.addEventListener('pointermove',e=>{
  if(!ptr.down||!ptr.dragEl) return;
  const r=boardEl.getBoundingClientRect(), cell=r.width/8;
  ptr.dragEl.style.transform=`translate(${(e.clientX-r.left)/cell-0.5*100}%,${(e.clientY-r.top)/cell-0.5*100}%)`;
});
window.addEventListener('pointerup',e=>{
  if(!ptr.down) return;
  ptr.down=false;
  if(ptr.dragEl){
    ptr.dragEl.style.transform=posTransform(ptr.from);
    const r=boardEl.getBoundingClientRect();
    const f=Math.floor((e.clientX-r.left)/(r.width/8)), rk=Math.floor((e.clientY-r.top)/(r.height/8));
    if(f>=0&&f<8&&rk>=0&&rk<8){
      const to=viewToBoard(rk*8+f);
      const m=legalCache.find(mv=>mv.from===ptr.from&&mv.to===to);
      if(m){ applyMove(m, true); selected=null; legalCache=[]; ptr.dragEl=null; return; }
    }
    ptr.dragEl=null;
  }
});

// UI & MODALS
function updateUI(){ $('#statusLine').textContent = G ? (G.st.turn===G.human?'Ваш ход':'Ход соперника...') : ''; }
function showModal(t, body, actions){
  const root=$('#modalRoot'); root.innerHTML='';
  const back=div('modal-back'), panel=div('modal');
  panel.innerHTML=`<div class="modal-head"><h3>${t}</h3><button class="xbtn">✕</button></div><div class="modal-body">${body}</div><div class="modal-foot"></div>`;
  const foot=panel.querySelector('.modal-foot');
  (actions||[]).forEach(a=>{const b=document.createElement('button');b.className='btn '+(a.primary?'primary':'');b.textContent=a.label;b.onclick=a.onClick;foot.appendChild(b);});
  panel.querySelector('.xbtn').onclick=closeModal;
  back.appendChild(panel); root.appendChild(back);
  return panel;
}
function closeModal(){ $('#modalRoot').innerHTML=''; }

function openSettings(){
  let boards = BOARD_SKINS.map((b,i)=>`<div class="theme-swatch ${S.equipped.board===i?'selected':''}" data-i="${i}" style="background:linear-gradient(135deg,${b.c1} 50%,${b.c2} 50%)"></div>`).join('');
  let textures = Object.keys(PIECE_TEXTURES).map(k=>`<div class="theme-swatch ${S.texture==k?'selected':''}" data-k="${k}" style="display:grid;place-items:center;background:var(--panel2)" title="${PIECE_TEXTURES[k].name}"><svg viewBox="0 0 24 24" style="width:24px;height:24px;fill:var(--fg)">${PIECE_TEXTURES[k].n}</svg></div>`).join('');
  
  const p = showModal('Настройки', `
    <div class="setRow" style="flex-direction:column;align-items:flex-start"><span>Текстурпак фигур (10 стилей)</span><div class="theme-grid">${textures}</div></div>
    <div class="setRow" style="flex-direction:column;align-items:flex-start"><span>Тема доски</span><div class="theme-grid">${boards}</div></div>
    <div class="setRow"><span>Цвет белых</span><input type="color" id="cw" value="${S.settings.pieceColorW}"></div>
    <div class="setRow"><span>Цвет чёрных</span><input type="color" id="cb" value="${S.settings.pieceColorB}"></div>
    <div class="setRow"><span>Звуки</span><div class="switch ${S.settings.sound?'on':''}" id="sw-snd"></div></div>
  `, [{label:'Закрыть',primary:true,onClick:closeModal}]);
  
  p.querySelectorAll('[data-i]').forEach(el=>el.onclick=()=>{S.equipped.board=+el.dataset.i; save(); applySettings(); el.parentElement.querySelectorAll('.theme-swatch').forEach(x=>x.classList.remove('selected')); el.classList.add('selected');});
  p.querySelectorAll('[data-k]').forEach(el=>el.onclick=()=>{S.texture=+el.dataset.k; save(); applySettings(); el.parentElement.querySelectorAll('.theme-swatch').forEach(x=>x.classList.remove('selected')); el.classList.add('selected');});
  p.querySelector('#cw').oninput=e=>{S.settings.pieceColorW=e.target.value; applySettings(); save();};
  p.querySelector('#cb').oninput=e=>{S.settings.pieceColorB=e.target.value; applySettings(); save();};
  p.querySelector('#sw-snd').onclick=e=>{S.settings.sound=!S.settings.sound; e.target.classList.toggle('on', S.settings.sound); save();};
}

function applySettings(){
  const b = BOARD_SKINS[S.equipped.board];
  document.documentElement.style.setProperty('--sq-light', b.c1);
  document.documentElement.style.setProperty('--sq-dark', b.c2);
  document.documentElement.style.setProperty('--pw', S.settings.pieceColorW);
  document.documentElement.style.setProperty('--pb', S.settings.pieceColorB);
  if(G) drawBoard(G.st);
}

function openShop(){
  let html = '<div class="grid">';
  SHOP_DATA.frames.forEach(f=>{
    const owned = S.inventory.frames.includes(f.id);
    const eq = S.equipped.frame===f.id;
    html += `<div class="card"><div class="prev"><div class="avatar ${f.id}">♟️</div></div><div class="nm">${f.name}</div>
             <button class="btn ${eq?'primary':''}" data-t="frames" data-id="${f.id}" data-p="${f.price}">${eq?'Надето':owned?'Надеть':f.price+'★'}</button></div>`;
  });
  html += '</div>';
  const p = showModal('Магазин', html, []);
  p.querySelectorAll('button').forEach(b=>b.onclick=async ()=>{
    const id=b.dataset.id, pr=+b.dataset.p;
    if(S.inventory.frames.includes(id)){ S.equipped.frame=id; save(); applySettings(); closeModal(); return; }
    if(S.stars < pr) return SFX.error();
    
    if(isOnline && supabase) {
      b.textContent='...';
      const res = await supabase.rpc('buy_item', { p_item_id: id, p_type: 'frames' });
      if(res.data && res.data.success) { S.stars=res.data.new_stars; S.inventory.frames=res.data.new_inventory.frames; S.equipped.frame=id; save(); SFX.capture(); closeModal(); }
      else { SFX.error(); b.textContent='Ошибка'; }
    } else {
      S.stars-=pr; S.inventory.frames.push(id); S.equipped.frame=id; save(); SFX.capture(); closeModal();
    }
  });
}

function openAccountModal(){
  if(!supabase) return toast('Загрузка...');
  if(currentUser){
    const p = showModal('Аккаунт', `
      <div style="text-align:center;margin-bottom:12px">${avatarHTML(64)}<h3>${esc(S.username)}</h3><div>★ ${S.stars} | Rating: ${S.rating}</div></div>
      <button class="btn" id="logout" style="width:100%">Выйти</button>
    `, []);
    p.querySelector('#logout').onclick=async()=>{await supabase.auth.signOut(); location.reload();};
  } else {
    const p = showModal('Вход', `
      <input class="authInput" id="u" placeholder="Ник" style="width:100%;padding:10px;margin-bottom:10px;border-radius:8px;border:1px solid #444;background:transparent;color:#fff">
      <input class="authInput" id="p" type="password" placeholder="Пароль" style="width:100%;padding:10px;margin-bottom:10px;border-radius:8px;border:1px solid #444;background:transparent;color:#fff">
      <button class="btn primary" id="login" style="width:100%">Войти</button>
    `, []);
    p.querySelector('#login').onclick=async()=>{
      const u=p.querySelector('#u').value, pw=p.querySelector('#p').value;
      const {data, error} = await supabase.auth.signInWithPassword({email:u+'@chez.game', password:pw});
      if(error) return toast(error.message);
      location.reload();
    };
  }
}

async function restoreSession(session){
  currentUser=session.user; isOnline=true;
  const {data} = await supabase.from('profiles').select('*').eq('id',session.user.id).maybeSingle();
  if(data){
    S.username=data.username; S.stars=data.stars||0; S.xp=data.xp||0; S.rating=data.rating||1000;
    S.is_premium=data.is_premium; isMod=data.is_mod; 
    if(data.inventory){ S.inventory.frames=data.inventory.frames||['']; }
    if(data.equipped){ S.equipped.frame=data.equipped.frame||''; }
    setAccountName(S.username); applySettings();
  }
}

// Init
function init(){
  buildSquares(); applySettings();
  startOfflineGame(0); // Демо-режим при входе
  
  if(window.innerWidth <= 768) {
    $('#side').style.display='none';
    $('.mobile-nav').style.display='grid';
  }
  
  loadSupabase();
  
  $$('.mbtn').forEach(b=>b.onclick=()=>{
    const act=b.dataset.act;
    if(act==='play') startOfflineGame(0);
    else if(act==='more') openSettings();
    else if(act==='account') openAccountModal();
    else if(act==='learn') toast('Скоро...');
  });
}
init();
})();
